; root — configuration
; Fill in the values for your environment before starting the service.

[server]
; TCP port the service listens on.
port = 8080

[upstream]
; TCP port the internal lookup backend listens on.
port = 8081
; How long to wait for the internal lookup backend before giving up.
timeout_seconds = 5

[storage]
; Directory where the service keeps its shared session state.
; The service verifies this directory during start-up.
shared_dir = /mnt/shgold-efs

[log]
; info | debug
level = info
; Write one access log line per request. on | off
access = on
; Also log health-check requests. The load balancer calls them every few
; seconds, so this is off by default.
access_health = off
