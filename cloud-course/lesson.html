<section class="panel"><h2>권장 네트워크 구성도</h2><div class="diagram">Internet
   │ HTTPS 443
   ▼
Internet Gateway → Public Subnet의 ALB
                         │ TCP 8080
                         ▼
                  Private App Subnet의 EKS Node/Pod
                         ├─ TCP 3306 → Private DB Subnet의 RDS MySQL
                         └─ HTTPS 443 → S3</div><p class="tip">예시 CIDR은 실습용입니다. 이미 사용 중인 VPC 또는 연결 대상과 겹치지 않도록 조정하세요. ALB만 Public Subnet에 두고 EKS Worker Node와 RDS는 Private Subnet에 배치합니다.</p></section>
<section class="panel"><h2>VPC 및 Subnet 설계표</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>구분</th><th>AZ</th><th>예시 CIDR</th><th>라우팅</th><th>배치 리소스</th></tr></thead><tbody>
<tr><td>VPC</td><td>서울 리전</td><td><code>10.0.0.0/16</code></td><td>DNS hostnames 활성화</td><td>전체 실습 리소스</td></tr>
<tr><td>Public-A</td><td>ap-northeast-2a</td><td><code>10.0.0.0/24</code></td><td><code>0.0.0.0/0 → IGW</code></td><td>ALB, NAT Gateway</td></tr>
<tr><td>Public-C</td><td>ap-northeast-2c</td><td><code>10.0.1.0/24</code></td><td><code>0.0.0.0/0 → IGW</code></td><td>ALB</td></tr>
<tr><td>Private-App-A</td><td>ap-northeast-2a</td><td><code>10.0.10.0/24</code></td><td><code>0.0.0.0/0 → NAT</code></td><td>EKS Worker Node/Pod</td></tr>
<tr><td>Private-App-C</td><td>ap-northeast-2c</td><td><code>10.0.11.0/24</code></td><td><code>0.0.0.0/0 → NAT</code></td><td>EKS Worker Node/Pod</td></tr>

</tbody></table></div></section>
<section class="panel"><h2>Security Group 규칙표</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>대상 SG</th><th>방향</th><th>프로토콜/포트</th><th>허용 Source/Destination</th><th>목적</th></tr></thead><tbody>
<tr><td>alb-sg</td><td>Inbound</td><td>HTTPS 443</td><td><code>0.0.0.0/0</code></td><td>인터넷 사용자 접속</td></tr>
<tr><td>alb-sg</td><td>Outbound</td><td>TCP 8080</td><td><code>eks-node-sg</code></td><td>애플리케이션 전달</td></tr>
<tr><td>eks-node-sg</td><td>Inbound</td><td>TCP 8080</td><td><code>alb-sg</code></td><td>ALB 요청만 허용</td></tr>
<tr><td>eks-node-sg</td><td>Outbound</td><td>TCP 3306</td><td><code>rds-sg</code></td><td>MySQL 읽기·쓰기</td></tr>
<tr><td>eks-node-sg</td><td>Outbound</td><td>HTTPS 443</td><td>S3 또는 <code>0.0.0.0/0</code></td><td>ECR/S3/API 접속</td></tr>
<tr><td>rds-sg</td><td>Inbound</td><td>TCP 3306</td><td><code>eks-node-sg</code></td><td>EKS 애플리케이션만 DB 접속</td></tr>
</tbody></table></div><p class="tip">IP 대역 전체를 Source로 허용하기보다 Security Group ID를 서로 참조해야 권한 범위가 작고 구성이 명확합니다. RDS에는 Public IP를 부여하지 않습니다.</p></section>
<section class="panel"><h2>구축 순서</h2><ol><li><code>10.0.0.0/16</code> VPC를 만들고 DNS resolution/hostnames를 활성화합니다.</li><li>2개 AZ에 Public, Private-App, Private-DB 서브넷을 각각 만듭니다.</li><li>Internet Gateway를 VPC에 연결하고 Public Route Table에 기본 경로를 추가합니다.</li><li>NAT Gateway를 Public-A에 만들고 Private-App Route Table의 기본 경로로 지정합니다.</li><li>DB Subnet Group에는 Private-DB-A와 Private-DB-C만 포함합니다.</li><li>위 표대로 ALB, EKS Node, RDS Security Group을 만들고 SG ID로 참조합니다.</li></ol></section>`;}if(n===1)prev.hidden=true;else prev.href=`lesson.html?lesson=${String(n-1).padStart(2,'0')}`;if(n===18)next.hidden=true;else next.href=`lesson.html?lesson=${String(n+1).padStart(2,'0')}`;
