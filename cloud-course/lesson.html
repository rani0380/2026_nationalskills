<section class="panel"><h2>1차시에서 완성할 것</h2><p>이 차시의 결과물은 AWS 리소스가 아니라 <strong>한 장짜리 구축 설계와 검증 순서</strong>입니다. 문제지의 고정 조건을 먼저 잠그고, 채점 점수와 직접 연결되는 트래픽 경로를 그린 뒤 2~18차시의 작업 순서를 확정합니다.</p><div class="check-grid"><div class="check-item"><b>Architecture</b>Client에서 RDS·S3까지 전체 경로</div><div class="check-item"><b>Constraints</b>리전·타입·금지 서비스 고정</div><div class="check-item"><b>Scoring</b>403/404·가용성·성능·비용 연결</div><div class="check-item"><b>Runbook</b>구축·검증·복구 순서 결정</div></div></section>
<section class="panel"><h2>문제지 고정 조건</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>영역</th><th>반드시 지킬 값</th><th>실수하면 생기는 문제</th></tr></thead><tbody><tr><td>Region</td><td><code>ap-northeast-2</code></td><td>다른 리전 리소스는 채점 실패·비용 증가</td></tr><tr><td>RDS</td><td>MySQL 8.0, <code>apdev-rds-instance</code>, Multi-AZ DB instance, <code>db.t3.micro</code>, gp3</td><td>지정 구성 불일치</td></tr><tr><td>Database</td><td><code>dev</code>, USER·PRODUCT 읽기/쓰기</td><td>앱 시작 또는 API 실패</td></tr><tr><td>Application</td><td>USER·PRODUCT·STRESS, <code>linux/amd64</code>, TCP 8080</td><td>이미지 실행·Target Health 실패</td></tr><tr><td>Container</td><td>Docker + EKS, Worker Node는 EC2 <code>t3.medium</code>만 사용</td><td>ECS·Fargate·다른 타입 사용 시 감점</td></tr><tr><td>Endpoint</td><td>프로토콜과 주소만 제출, 경로 금지</td><td>채점 트래픽 주입 실패</td></tr><tr><td>Time</td><td>KST(UTC+9)</td><td>로그·지표·장애 시점 대조 오류</td></tr><tr><td>Forbidden</td><td>Lambda·Fargate 사용 금지, 불필요한 리소스 생성 금지</td><td>채점 제외 또는 비용 감점 가능</td></tr></tbody></table></div><p class="tip">버킷명·ECR Repository명처럼 자유롭게 정할 수 있는 값과, 인스턴스 타입·리전처럼 바꾸면 안 되는 값을 설계 노트에서 색으로 구분합니다.</p></section>
<section class="panel"><h2>최종 아키텍처</h2><div class="diagram">Internet Client
      │ HTTPS · 단일 Endpoint
      ▼
CloudFront (+ 선택적 WAF)
      ├── /images/* ──▶ Private S3 (OAC)
      │                       ▲
      │                       │ PRODUCT Pod Identity로 Upload
      └── API/* ─────▶ Internet-facing ALB
                               │ Ingress path routing
                               ▼
                    EKS on EC2 t3.medium
                    ├── USER Service ─────┐
                    ├── PRODUCT Service ──┼──▶ RDS MySQL Multi-AZ
                    └── STRESS Service    ┘

CloudWatch ◀── ALB·EKS·Container logs/metrics</div><p>외부 사용자는 주소 하나만 사용합니다. API는 ALB와 EKS로, <code>/images/*</code>는 비공개 S3로 전달합니다. PRODUCT만 Pod Identity를 통해 S3 Object를 쓰며 인터넷 사용자는 S3 직접 URL로 접근하지 않습니다.</p></section>
<section class="panel"><h2>요청 경로와 담당 컴포넌트</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>외부 경로</th><th>최종 대상</th><th>정상 코드·목표</th><th>주요 검증</th></tr></thead><tbody><tr><td><code>/v1/user</code></td><td>USER Pod → RDS</td><td>POST 201, GET 200 · SLO 0.2초</td><td>requestid·uuid, DB 읽기/쓰기</td></tr><tr><td><code>/v1/product</code></td><td>PRODUCT Pod → RDS/S3</td><td>POST 201, GET·PUT 200 · SLO 0.2초</td><td>동일 ID 조회, 이미지 Upload</td></tr><tr><td><code>/v1/stress</code></td><td>STRESS Pod</td><td>POST 201 · SLO 1초</td><td>부하 후에도 가용성 유지</td></tr><tr><td><code>/healthcheck</code></td><td>Pod Health Endpoint</td><td>GET 200</td><td>Probe·ALB Target Health</td></tr><tr><td><code>/images/&lt;object-key&gt;</code></td><td>CloudFront → S3</td><td>GET 200 · 5초 이내</td><td>S3 직접 접근은 비공개</td></tr><tr><td>정상 API의 비정상 요청</td><td>검증 계층</td><td>403</td><td>필수 검증값·형식 누락</td></tr><tr><td>등록되지 않은 API</td><td>Routing 계층</td><td>404</td><td><code>/v1/none</code></td></tr></tbody></table></div><p class="tip">응답시간과 응답코드는 AWS 내부가 아니라 <strong>채점 클라이언트 도착 기준</strong>입니다. Request·Response와 <code>requestid</code>·<code>uuid</code>를 중간 계층에서 임의로 바꾸지 않습니다.</p></section>
<section class="panel"><h2>채점표를 운영 목표로 변환</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>채점 영역</th><th>배점</th><th>운영 목표</th><th>관련 차시</th></tr></thead><tbody><tr><td>비정상 요청 처리</td><td>4점</td><td>Image 제공과 403/404 성공 비율 확보</td><td>11~12차시</td></tr><tr><td>고가용성·안정성</td><td>12점</td><td>세 API의 성공 응답 비율 최대화</td><td>7~13·17차시</td></tr><tr><td>성능 효율성</td><td>12점</td><td>USER·PRODUCT 0.2초, STRESS 1초 비율 최대화</td><td>13~15차시</td></tr><tr><td>비용 최적화</td><td>12점</td><td>성능 하한을 유지하며 Cost Ratio 최소화</td><td>15~16차시</td></tr></tbody></table></div><p>리소스를 많이 만드는 것이 정답이 아닙니다. 지정 RDS Multi-AZ는 유지하되 EKS Node와 Replica는 측정 근거로만 조절합니다. 성능 점수가 확보되지 않은 상태에서 비용만 줄이면 비용 항목도 인정받기 어렵습니다.</p></section>
<section class="panel"><h2>최소 리소스 계획</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>리소스</th><th>시작 수량</th><th>설계 원칙</th></tr></thead><tbody><tr><td>VPC</td><td>1</td><td><code>10.0.0.0/16</code>, 서울 리전</td></tr><tr><td>Subnet</td><td>6</td><td>2 AZ × Public·Private App·Private DB</td></tr><tr><td>Internet Gateway</td><td>1</td><td>Public Route에만 연결</td></tr><tr><td>NAT Gateway</td><td>1</td><td>비용을 고려한 최소 시작 구성</td></tr><tr><td>RDS</td><td>1</td><td>지정 Multi-AZ DB instance</td></tr><tr><td>EKS Cluster / Node Group</td><td>각 1</td><td>중복 Cluster·Node Group 금지</td></tr><tr><td>Worker Node</td><td>2</td><td>두 AZ의 <code>t3.medium</code>, 측정 후 조정</td></tr><tr><td>ECR Repository</td><td>3</td><td>USER·PRODUCT·STRESS 앱별 분리</td></tr><tr><td>ALB / CloudFront</td><td>각 1</td><td>최종 외부 Endpoint 단일화</td></tr><tr><td>S3 Bucket</td><td>1</td><td>Block Public Access + OAC</td></tr></tbody></table></div></section>
<section class="panel"><h2>리소스 이름과 변수 노트</h2><pre class="code-block">AWS_REGION=ap-northeast-2
VPC_NAME=apdev-vpc
CLUSTER_NAME=apdev-eks
NODEGROUP_NAME=apdev-node-group
RDS_IDENTIFIER=apdev-rds-instance
DB_NAME=dev
NAMESPACE=apdev

AWS_ACCOUNT_ID=&lt;12자리 계정 ID&gt;
RDS_ENDPOINT=&lt;RDS DNS&gt;
BUCKET=&lt;고유한 S3 버킷명&gt;
FINAL_ENDPOINT=https://&lt;최종 DNS&gt;</pre><p class="tip">대소문자가 다른 이름을 새 리소스로 인식할 수 있으므로 명명 규칙을 시작 전에 확정합니다. 실제 비밀번호와 Access Key는 이 노트나 Git에 기록하지 않습니다.</p></section>
<section class="panel"><h2>AWS 작업 전 사전 점검</h2><pre class="code-block">export AWS_REGION=ap-northeast-2
export AWS_DEFAULT_REGION=ap-northeast-2

aws sts get-caller-identity
aws configure get region
date '+%Y-%m-%d %H:%M:%S %Z'

test "$(aws configure get region)" = 'ap-northeast-2' \
  &amp;&amp; echo 'REGION PASS' \
  || echo 'REGION CHECK REQUIRED'</pre><p>계정 ID가 선수에게 배정된 계정과 같은지 확인합니다. AWS CLI 기본 리전과 각 명령의 <code>--region</code>이 다르면 다른 리전에 리소스를 만들 수 있습니다.</p></section>
<section class="panel"><h2>구축 순서와 차시 연결</h2><ol><li><strong>2~4차시:</strong> 네트워크·RDS·바이너리를 먼저 검증해 애플리케이션 기준선을 만듭니다.</li><li><strong>5~6차시:</strong> 같은 바이너리를 Docker 이미지로 만들고 ECR Digest를 확정합니다.</li><li><strong>7~9차시:</strong> EKS EC2 Node에 세 앱을 배포하고 내부 통신을 검증합니다.</li><li><strong>10~12차시:</strong> ALB·CloudFront·S3를 하나의 Endpoint로 묶고 403/404를 확정합니다.</li><li><strong>13~16차시:</strong> 로그와 동일 부하 측정으로 성능·비용을 한 항목씩 조정합니다.</li><li><strong>17~18차시:</strong> 장애 복구와 3시간 전체 구축을 반복합니다.</li></ol><p class="tip">각 단계에서 검증이 끝나기 전에 다음 단계로 넘어가지 않습니다. 4차시 단독 실행이 실패하면 EKS를 먼저 만들지 않고 RDS·환경변수·바이너리부터 해결합니다.</p></section>
<section class="panel"><h2>3시간 경기 시간 배분</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>시간</th><th>작업</th><th>통과 조건</th></tr></thead><tbody><tr><td>0~15분</td><td>문제 고정값·계정·리전·제공 파일 확인</td><td>변수 노트와 SHA-256 기록</td></tr><tr><td>15~55분</td><td>VPC·RDS·데이터·앱 단독 검증</td><td>DB 읽기/쓰기와 API 성공</td></tr><tr><td>55~105분</td><td>Docker·ECR·EKS·세 앱 배포</td><td>세 Service Health 200</td></tr><tr><td>105~135분</td><td>ALB·S3·CloudFront·단일 Endpoint</td><td>API와 Image가 같은 주소에서 성공</td></tr><tr><td>135~160분</td><td>403/404·모니터링·부하 측정</td><td>오류코드와 SLO 결과 기록</td></tr><tr><td>160~175분</td><td>병목·비용 조정 후 재측정</td><td>성능 하한을 유지한 최소 구성</td></tr><tr><td>175~180분</td><td>Endpoint 제출·부하 종료·최종 점검</td><td>프로토콜 포함, 경로 없음</td></tr></tbody></table></div></section>
<section class="panel"><h2>Endpoint 제출 형식</h2><div class="check-grid"><div class="check-item"><b>정상</b><code>https://example.org</code></div><div class="check-item"><b>프로토콜 누락</b><code>example.org</code> — 잘못된 형식</div><div class="check-item"><b>경로 포함</b><code>https://example.org/v1/</code> — 잘못된 형식</div><div class="check-item"><b>노출 주의</b>본인 Endpoint를 타인에게 공유하지 않음</div></div><pre class="code-block">ENDPOINT='https://&lt;FINAL_DOMAIN&gt;'

printf '%s\n' "$ENDPOINT"
curl -i "$ENDPOINT/healthcheck"
curl -i "$ENDPOINT/v1/none"</pre></section>
<section class="panel"><h2>1차시 완료 체크리스트</h2><ul><li>서울 리전과 금지 서비스가 설계 노트에 표시됐습니다.</li><li>Client→CloudFront→ALB/EKS 및 S3 경로를 설명할 수 있습니다.</li><li>USER·PRODUCT·STRESS의 API, 정상 코드와 SLO가 표로 정리됐습니다.</li><li>403과 404가 어떤 요청에서 발생해야 하는지 구분했습니다.</li><li>지정 RDS와 EC2 타입, 최소 리소스 수량을 기록했습니다.</li><li>최종 Endpoint 제출 형식이 프로토콜 포함·경로 제외임을 확인했습니다.</li><li>3시간 구축 순서와 단계별 중단·검증 지점을 정했습니다.</li><li>비밀번호·Access Key를 문서나 Git에 기록하지 않았습니다.</li></ul></section>`;}if(n===2){document.getElementById('lesson-extra').innerHTML=`
<section class="panel"><h2>권장 네트워크 구성도</h2><div class="diagram">Internet
   │ HTTPS 443
   ▼
Internet Gateway → Public Subnet의 ALB
                         │ TCP 8080
                         ▼
                  Private App Subnet의 EKS Node/Pod
                         ├─ TCP 3306 → Private DB Subnet의 RDS MySQL
                         └─ HTTPS 443 → S3</div><p class="tip">예시 CIDR은 실습용입니다. 이미 사용 중인 VPC 또는 연결 대상과 겹치지 않도록 조정하세요. ALB만 Public Subnet에 두고 EKS Worker Node와 RDS는 Private Subnet에 배치합니다.</p></section>
<section class="panel"><h2>VPC 및 Subnet 설계표</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>구분</th><th>AZ</th><th>이름</th><th>CIDR</th><th>용도</th></tr></thead><tbody>
<tr><td>Public</td><td>ap-northeast-2a</td><td><code>public-a</code></td><td><code>10.0.1.0/24</code></td><td>ALB, NAT Gateway</td></tr>
<tr><td>Public</td><td>ap-northeast-2c</td><td><code>public-c</code></td><td><code>10.0.2.0/24</code></td><td>ALB, NAT Gateway</td></tr>
<tr><td><strong>Private App</strong></td><td>ap-northeast-2a</td><td><code>private-a</code></td><td><code>10.0.3.0/24</code></td><td><strong>EKS Worker Node / Pod</strong></td></tr>
<tr><td><strong>Private App</strong></td><td>ap-northeast-2c</td><td><code>private-c</code></td><td><code>10.0.4.0/24</code></td><td><strong>EKS Worker Node / Pod</strong></td></tr>
<tr><td><strong>Private DB</strong></td><td>ap-northeast-2a</td><td><code>db-a</code></td><td><code>10.0.11.0/24</code></td><td>RDS</td></tr>
<tr><td><strong>Private DB</strong></td><td>ap-northeast-2c</td><td><code>db-c</code></td><td><code>10.0.12.0/24</code></td><td>RDS</td></tr>
</tbody></table></div><p class="tip">VPC CIDR은 <code>10.0.0.0/16</code>을 사용합니다. Public 서브넷은 Internet Gateway 경로를, Private App 서브넷은 NAT Gateway 경로를 사용하며 Private DB 서브넷은 인터넷 기본 경로를 두지 않습니다.</p></section>
<section class="panel"><h2>Gateway 구성표</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>구성 요소</th><th>이름</th><th>배치·연결 위치</th><th>연결 대상</th><th>용도</th></tr></thead><tbody>
<tr><td>Internet Gateway</td><td><code>apdev-igw</code></td><td><code>apdev-vpc</code>에 Attach</td><td>Public Route Table</td><td>ALB의 인터넷 통신 및 NAT Gateway의 외부 경로</td></tr>
<tr><td>NAT Gateway A</td><td><code>apdev-nat-a</code></td><td><code>public-a</code> / Elastic IP</td><td><code>private-app-rt-a</code></td><td>2a의 EKS Node·Pod가 외부 API, ECR 등에 접근</td></tr>
<tr><td>NAT Gateway C</td><td><code>apdev-nat-c</code></td><td><code>public-c</code> / Elastic IP</td><td><code>private-app-rt-c</code></td><td>2c의 EKS Node·Pod가 외부 API, ECR 등에 접근</td></tr>
</tbody></table></div><p class="tip">가용 영역 장애에 대비하려면 AZ마다 NAT Gateway를 하나씩 두고 같은 AZ의 Private App Subnet이 사용하도록 구성합니다. 비용을 줄이기 위해 실습에서 NAT Gateway 하나만 사용할 경우에는 <code>private-a</code>와 <code>private-c</code> 모두 그 NAT를 향하게 할 수 있지만, 단일 장애 지점과 교차 AZ 데이터 처리 비용이 생깁니다.</p></section>
<section class="panel"><h2>Route Table 연결표</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>Route Table</th><th>연결 Subnet</th><th>Destination</th><th>Target</th><th>설명</th></tr></thead><tbody>
<tr><td><code>public-rt</code></td><td><code>public-a</code>, <code>public-c</code></td><td><code>10.0.0.0/16</code></td><td><code>local</code></td><td>VPC 내부 통신</td></tr>
<tr><td><code>public-rt</code></td><td><code>public-a</code>, <code>public-c</code></td><td><code>0.0.0.0/0</code></td><td><code>apdev-igw</code></td><td>ALB와 NAT Gateway의 인터넷 경로</td></tr>
<tr><td><code>private-app-rt-a</code></td><td><code>private-a</code></td><td><code>10.0.0.0/16</code></td><td><code>local</code></td><td>VPC 내부 통신</td></tr>
<tr><td><code>private-app-rt-a</code></td><td><code>private-a</code></td><td><code>0.0.0.0/0</code></td><td><code>apdev-nat-a</code></td><td>2a App Subnet의 Outbound 인터넷 통신</td></tr>
<tr><td><code>private-app-rt-c</code></td><td><code>private-c</code></td><td><code>10.0.0.0/16</code></td><td><code>local</code></td><td>VPC 내부 통신</td></tr>
<tr><td><code>private-app-rt-c</code></td><td><code>private-c</code></td><td><code>0.0.0.0/0</code></td><td><code>apdev-nat-c</code></td><td>2c App Subnet의 Outbound 인터넷 통신</td></tr>
<tr><td><code>private-db-rt</code></td><td><code>db-a</code>, <code>db-c</code></td><td><code>10.0.0.0/16</code></td><td><code>local</code></td><td>RDS는 VPC 내부에서만 통신</td></tr>
</tbody></table></div><p class="tip">Private DB Route Table에는 <code>0.0.0.0/0</code> 경로를 추가하지 않습니다. 모든 Route Table에 자동 생성되는 <code>local</code> 경로는 삭제하거나 변경하지 않습니다.</p></section><section class="panel"><h2>Security Group 규칙표</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>대상 SG</th><th>방향</th><th>프로토콜/포트</th><th>허용 Source/Destination</th><th>목적</th></tr></thead><tbody>
<tr><td>alb-sg</td><td>Inbound</td><td>HTTPS 443</td><td><code>0.0.0.0/0</code></td><td>인터넷 사용자 접속</td></tr>
<tr><td>alb-sg</td><td>Outbound</td><td>TCP 8080</td><td><code>eks-node-sg</code></td><td>애플리케이션 전달</td></tr>
<tr><td>eks-node-sg</td><td>Inbound</td><td>TCP 8080</td><td><code>alb-sg</code></td><td>ALB 요청만 허용</td></tr>
<tr><td>eks-node-sg</td><td>Outbound</td><td>TCP 3306</td><td><code>rds-sg</code></td><td>MySQL 읽기·쓰기</td></tr>
<tr><td>eks-node-sg</td><td>Outbound</td><td>HTTPS 443</td><td>S3 또는 <code>0.0.0.0/0</code></td><td>ECR/S3/API 접속</td></tr>
<tr><td>rds-sg</td><td>Inbound</td><td>TCP 3306</td><td><code>eks-node-sg</code></td><td>EKS 애플리케이션만 DB 접속</td></tr>
</tbody></table></div><p class="tip">IP 대역 전체를 Source로 허용하기보다 Security Group ID를 서로 참조해야 권한 범위가 작고 구성이 명확합니다. RDS에는 Public IP를 부여하지 않습니다.</p></section>
<section class="panel"><h2>구축 순서</h2><ol><li><code>10.0.0.0/16</code> VPC를 만들고 DNS resolution/hostnames를 활성화합니다.</li><li>2개 AZ에 Public, Private-App, Private-DB 서브넷을 각각 만듭니다.</li><li>Internet Gateway를 VPC에 연결하고 Public Route Table에 기본 경로를 추가합니다.</li><li>NAT Gateway를 Public-A에 만들고 Private-App Route Table의 기본 경로로 지정합니다.</li><li>DB Subnet Group에는 Private-DB-A와 Private-DB-C만 포함합니다.</li><li>위 표대로 ALB, EKS Node, RDS Security Group을 만들고 SG ID로 참조합니다.</li></ol></section>`;}if(n===3){document.getElementById('lesson-extra').innerHTML=`
<section class="panel"><h2>대회 지정 RDS 구성표</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>항목</th><th>설정값</th><th>확인 이유</th></tr></thead><tbody>
<tr><td>DB identifier</td><td><code>apdev-rds-instance</code></td><td>대소문자까지 명세와 일치</td></tr>
<tr><td>Region</td><td><code>ap-northeast-2</code></td><td>서울 리전에 생성</td></tr>
<tr><td>Engine</td><td>MySQL Community 8.0</td><td>제공 애플리케이션 호환</td></tr>
<tr><td>Deployment</td><td>Multi-AZ DB instance</td><td>장애 시 Standby로 자동 전환</td></tr>
<tr><td>Instance class</td><td><code>db.t3.micro</code></td><td>지정 타입과 비용 조건 준수</td></tr>
<tr><td>Storage</td><td>General Purpose SSD <code>gp3</code></td><td>대회 지정 스토리지</td></tr>
<tr><td>Initial DB name</td><td><code>dev</code></td><td>MYSQL_DBNAME 환경변수와 일치</td></tr>
<tr><td>Port</td><td><code>3306</code></td><td>MySQL 기본 포트</td></tr>
<tr><td>Public access</td><td><strong>No</strong></td><td>Private DB Subnet에서만 운영</td></tr>
</tbody></table></div></section>
<section class="panel"><h2>연결 구조</h2><div class="diagram">EKS Pod / Worker Node
   │ MYSQL_HOST = RDS endpoint (엔진명·프로토콜 제외)
   │ TCP 3306, Source = eks-node-sg
   ▼
rds-sg → apdev-rds-instance → dev
                                ├─ user
                                └─ product</div><p class="tip">DB Subnet Group에는 2차시에서 만든 <code>db-a</code>(ap-northeast-2a)와 <code>db-c</code>(ap-northeast-2c)만 넣습니다. RDS Security Group의 3306 Inbound Source는 IP 대역이 아니라 <code>eks-node-sg</code>로 지정합니다.</p></section>
<section class="panel"><h2>AWS 콘솔 생성 순서</h2><ol><li>RDS → Subnet groups에서 <code>apdev-db-subnet-group</code>을 만들고 <code>db-a</code>, <code>db-c</code>를 선택합니다.</li><li>Security Group <code>rds-sg</code>를 만들고 TCP 3306 Source를 <code>eks-node-sg</code>로 제한합니다.</li><li>RDS → Create database → Standard create → MySQL을 선택합니다.</li><li>위 지정 구성표대로 identifier, Multi-AZ, db.t3.micro, gp3, dev를 입력합니다.</li><li>Connectivity에서 실습 VPC, DB Subnet Group, <strong>Public access No</strong>, <code>rds-sg</code>를 선택합니다.</li><li>생성 완료 후 Connectivity & security에서 RDS endpoint와 포트 3306을 기록합니다.</li></ol></section>
<section class="panel"><h2>EC2 접속 실습 구성</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>항목</th><th>설정</th><th>확인 사항</th></tr></thead><tbody>
<tr><td>EC2 위치</td><td><code>private-a</code> 또는 <code>private-c</code></td><td>RDS와 동일한 VPC 사용</td></tr>
<tr><td>EC2 Security Group</td><td><code>ec2-test-sg</code></td><td>Outbound TCP 3306 허용</td></tr>
<tr><td>RDS Security Group</td><td><code>rds-sg</code></td><td>Inbound TCP 3306 Source = <code>ec2-test-sg</code></td></tr>
<tr><td>EC2 접속</td><td>Systems Manager Session Manager 권장</td><td>Public IP와 SSH 22 개방 없이 접속</td></tr>
<tr><td>이름 확인</td><td>VPC DNS support/hostnames 활성화</td><td>RDS Endpoint를 DNS로 해석</td></tr>
</tbody></table></div><div class="diagram">관리자 → Session Manager → EC2 실습 서버
                              │ TCP 3306
                              ▼
                    rds-sg → RDS MySQL</div><p class="tip">RDS를 Public access로 변경하거나 <code>0.0.0.0/0</code>에서 3306을 허용하지 않습니다. RDS Inbound Source에는 EC2의 IP가 아니라 <code>ec2-test-sg</code>의 Security Group ID를 지정합니다.</p></section>
<section class="panel"><h2>1. EC2에서 RDS Endpoint 확인</h2><p>Session Manager 또는 허용된 SSH 방식으로 EC2에 접속한 후 다음 명령을 실행합니다.</p><pre class="code-block">export AWS_REGION=ap-northeast-2
export DB_ID=apdev-rds-instance

export RDS_ENDPOINT=$(aws rds describe-db-instances \
  --region "$AWS_REGION" \
  --db-instance-identifier "$DB_ID" \
  --query 'DBInstances[0].Endpoint.Address' \
  --output text)
export RDS_PORT=$(aws rds describe-db-instances \
  --region "$AWS_REGION" \
  --db-instance-identifier "$DB_ID" \
  --query 'DBInstances[0].Endpoint.Port' \
  --output text)

printf 'endpoint=%s\nport=%s\n' "$RDS_ENDPOINT" "$RDS_PORT"
getent hosts "$RDS_ENDPOINT"</pre><p class="tip">EC2 Role에 RDS 조회 권한이 없다면 RDS 콘솔의 Connectivity &amp; security에서 Endpoint와 Port를 복사하여 직접 <code>RDS_ENDPOINT</code>, <code>RDS_PORT</code> 변수에 넣어도 됩니다. Endpoint 앞에 <code>mysql://</code>을 붙이지 않습니다.</p></section>
<section class="panel"><h2>2. MySQL Client 설치</h2><pre class="code-block"># Amazon Linux 2023
sudo dnf install -y mariadb105

# Ubuntu를 사용한 경우
# sudo apt-get update
# sudo apt-get install -y mysql-client

mysql --version</pre><p class="tip">EC2가 Private Subnet에 있다면 패키지 설치를 위해 NAT Gateway 또는 필요한 저장소용 VPC Endpoint 경로가 필요합니다. 설치가 끝난 실습 AMI를 사용하면 대회 중 시간을 줄일 수 있습니다.</p></section>
<section class="panel"><h2>3. DNS·포트 연결 확인</h2><pre class="code-block"># DNS가 사설 IP로 해석되는지 확인
getent ahostsv4 "$RDS_ENDPOINT"

# TCP 3306 연결 확인: 둘 중 설치된 명령 사용
nc -vz -w 5 "$RDS_ENDPOINT" "$RDS_PORT"
# timeout 5 bash -c "&lt;/dev/tcp/$RDS_ENDPOINT/$RDS_PORT" &amp;&amp; echo CONNECTED</pre><div class="check-grid"><div class="check-item"><b>DNS 성공 + TCP 성공</b>MySQL 로그인 단계로 이동</div><div class="check-item"><b>DNS 실패</b>Endpoint 오타와 VPC DNS 확인</div><div class="check-item"><b>TCP Timeout</b>RDS 상태·SG·NACL·VPC 확인</div><div class="check-item"><b>Connection refused</b>Endpoint·Port와 RDS 상태 확인</div></div></section>
<section class="panel"><h2>4. Master 계정으로 MySQL 접속</h2><pre class="code-block">mysql \
  --host="$RDS_ENDPOINT" \
  --port="$RDS_PORT" \
  --user=&lt;MASTER_USER&gt; \
  --password \
  --connect-timeout=5</pre><p><code>Enter password:</code>가 표시되면 RDS 생성 시 지정한 Master password를 입력합니다. 비밀번호를 명령행에 직접 쓰지 않습니다.</p><pre class="code-block">SELECT VERSION();
SELECT CURRENT_USER();
SHOW DATABASES;
USE dev;
SELECT DATABASE();
EXIT;</pre><p class="tip">MySQL 프롬프트가 나타나고 <code>SELECT DATABASE()</code> 결과가 <code>dev</code>이면 EC2 → RDS 네트워크와 인증이 모두 정상입니다.</p></section>
<section class="panel"><h2>5. 한 번에 접속 검증</h2><pre class="code-block">mysql \
  -h "$RDS_ENDPOINT" \
  -P "$RDS_PORT" \
  -u &lt;MASTER_USER&gt; \
  -p \
  -D dev \
  -e "SELECT NOW() AS db_time, DATABASE() AS db_name, CURRENT_USER() AS login_user;"</pre><p>명령이 성공하면 출력 결과와 RDS Endpoint를 채점 증빙으로 기록한 뒤 아래 단계에서 <code>appuser</code>와 테이블을 생성합니다.</p></section>
<section class="panel"><h2>EC2 → RDS 접속 오류 해결표</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>증상</th><th>주요 원인</th><th>확인·조치</th></tr></thead><tbody>
<tr><td><code>Unknown MySQL server host</code></td><td>Endpoint 오타 또는 DNS 비활성</td><td><code>getent hosts</code>, VPC DNS 설정 확인</td></tr>
<tr><td><code>Connection timed out</code></td><td>RDS SG Source 오류, 다른 VPC, NACL 차단</td><td>3306 Source가 <code>ec2-test-sg</code>인지 확인</td></tr>
<tr><td><code>Access denied</code></td><td>사용자명·비밀번호·권한 오류</td><td>Master username과 Secret 값을 재확인</td></tr>
<tr><td><code>Unknown database 'dev'</code></td><td>초기 DB가 생성되지 않음</td><td>Master 계정으로 <code>CREATE DATABASE dev</code> 실행</td></tr>
<tr><td>AWS CLI <code>AccessDenied</code></td><td>EC2 Role에 RDS 조회 권한 없음</td><td>콘솔에서 Endpoint 복사 또는 최소 조회 권한 부여</td></tr>
</tbody></table></div></section><section class="panel"><h2>데이터베이스와 애플리케이션 계정 생성</h2><p>RDS Master 계정으로 접속한 뒤 애플리케이션 전용 계정을 만듭니다. 비밀번호는 예시 문자열을 그대로 사용하지 말고 안전한 값으로 바꾸세요.</p><pre class="code-block">mysql -h &lt;RDS_ENDPOINT&gt; -P 3306 -u &lt;MASTER_USER&gt; -p

CREATE DATABASE IF NOT EXISTS dev
  CHARACTER SET utf8mb4
  COLLATE utf8mb4_unicode_ci;

CREATE USER IF NOT EXISTS 'appuser'@'%'
  IDENTIFIED BY '&lt;STRONG_PASSWORD&gt;';
GRANT SELECT, INSERT, UPDATE, DELETE ON dev.* TO 'appuser'@'%';
FLUSH PRIVILEGES;</pre></section>
<section class="panel"><h2>테이블 생성 SQL</h2><pre class="code-block">USE dev;

CREATE TABLE user (
    id        VARCHAR(255) NOT NULL,
    username  VARCHAR(255) NOT NULL,
    email     VARCHAR(255) NOT NULL,
    PRIMARY KEY (id),
    UNIQUE KEY uk_username (username),
    INDEX idx_user_email (email)
);

CREATE TABLE product (
    id          VARCHAR(255) NOT NULL,
    name        VARCHAR(255) NOT NULL,
    price       FLOAT(8) NOT NULL,
    image_path  VARCHAR(500) DEFAULT NULL,
    PRIMARY KEY (id)
);</pre><p class="tip"><code>GET /v1/user?email=...</code> 요청이 반복되므로 <code>email</code> 인덱스를 추가합니다. product는 기본키 <code>id</code> 조회가 빈번하므로 Primary Key 인덱스를 그대로 활용합니다.</p></section>

<section class="panel"><h2>load_user.dump 적재</h2><p>테이블 생성 후 빈 USER 테이블에 한 번만 적재합니다. 먼저 현재 건수를 확인하고, 적재 도중 오류가 발생하면 메시지를 보존한 뒤 원인을 해결합니다.</p><pre class="code-block">cd ~/app-test/data

mysql -h "$RDS_ENDPOINT" -P 3306   -u appuser -p -D dev   -e "SELECT COUNT(*) AS before_count FROM user;"

mysql -h "$RDS_ENDPOINT" -P 3306   -u appuser -p dev &lt; load_user.dump

mysql -h "$RDS_ENDPOINT" -P 3306   -u appuser -p -D dev   -e "SELECT COUNT(*) AS after_count FROM user;
      SELECT id,username,email FROM user ORDER BY id LIMIT 3;"</pre><div class="check-grid"><div class="check-item"><b>연습용 기대 건수</b><code>after_count = 1000</code></div><div class="check-item"><b>샘플 조회</b><code>dbdump000001</code>부터 출력</div><div class="check-item"><b>중복 검사</b>id·username 중복 없음</div><div class="check-item"><b>공식 대회</b>공식 dump의 원본 건수 유지</div></div><pre class="code-block">mysql -h "$RDS_ENDPOINT" -P 3306   -u appuser -p -D dev   -e "SELECT id,COUNT(*) c FROM user GROUP BY id HAVING c &gt; 1;
      SELECT username,COUNT(*) c FROM user GROUP BY username HAVING c &gt; 1;"</pre><p class="tip">대회 당일에는 반드시 주최 측이 제공한 <code>load_user.dump</code>를 사용하고 데이터를 임의로 수정·삭제하거나 추가하지 않습니다. 이미 적재한 dump를 다시 실행하면 Primary Key 또는 Unique Key 중복 오류가 발생하는 것이 정상입니다.</p></section>

<section class="panel"><h2>단독 실행의 목적</h2><p>컨테이너와 EKS를 만들기 전에 바이너리 자체, RDS 연결, API 규격을 먼저 검증합니다. 이 단계에서 실패하면 Docker나 Kubernetes 문제가 아니라 애플리케이션·환경변수·DB 문제로 범위를 좁힐 수 있습니다.</p><div class="check-grid"><div class="check-item"><b>USER</b>POST/GET 및 RDS 읽기·쓰기</div><div class="check-item"><b>PRODUCT</b>POST/GET/PUT 이미지 업로드</div><div class="check-item"><b>STRESS</b>CPU 부하 요청과 응답시간</div><div class="check-item"><b>공통</b>healthcheck, 403, 404, access log</div></div></section>
<section class="panel"><h2>실행 환경 체크표</h2><p>이 표는 <strong>4차시 단독 실행에 사용할 EC2</strong>를 기준으로 확인합니다. 먼저 AWS 콘솔에서 인스턴스를 찾고 Session Manager 또는 SSH로 그 EC2에 접속한 뒤 터미널 명령을 실행합니다. RDS Endpoint만 RDS 콘솔에서 복사합니다.</p><div class="diagram">AWS Console
├── EC2 → Instances → 실습용 인스턴스 → Instance details
│      └── Connect → Session Manager 또는 SSH → 아래 Linux 명령 실행
└── RDS → Databases → apdev-rds-instance → Connectivity &amp; security
       └── Endpoint와 Port 3306 확인</div><div class="table-wrap"><table class="network-table"><thead><tr><th>항목</th><th>기준</th><th>어디에서 확인?</th><th>확인 방법</th><th>정상 결과</th></tr></thead><tbody>
<tr><td>OS</td><td>Amazon Linux 2023</td><td>실습용 EC2 터미널</td><td><code>cat /etc/os-release</code></td><td><code>NAME="Amazon Linux"</code>, <code>VERSION="2023"</code></td></tr>
<tr><td>Architecture</td><td>x86_64 / amd64</td><td>실습용 EC2 터미널</td><td><code>uname -m</code></td><td><code>x86_64</code></td></tr>
<tr><td>EC2 type</td><td><code>t3.medium</code></td><td>AWS Console → EC2 → Instances</td><td>인스턴스 선택 → Details → Instance type</td><td><code>t3.medium</code></td></tr>
<tr><td>Application port</td><td>TCP <code>8080</code></td><td>앱을 실행한 EC2 터미널</td><td><code>sudo ss -lntp | grep ':8080'</code></td><td><code>LISTEN</code>과 <code>:8080</code></td></tr>
<tr><td>Timezone</td><td>KST / Asia/Seoul</td><td>실습용 EC2 터미널</td><td><code>timedatectl</code></td><td><code>Time zone: Asia/Seoul (KST, +0900)</code></td></tr>
<tr><td>RDS Endpoint</td><td><code>apdev-rds-instance</code> 주소</td><td>AWS Console → RDS → Databases</td><td>Connectivity &amp; security → Endpoint</td><td><code>*.ap-northeast-2.rds.amazonaws.com</code></td></tr>
<tr><td>RDS access</td><td>Endpoint TCP 3306</td><td>실습용 EC2 터미널</td><td><code>nc -vz -w 5 "$RDS_ENDPOINT" 3306</code></td><td><code>succeeded</code> 또는 <code>open</code></td></tr>
</tbody></table></div><p class="tip"><strong>포트 8080 확인은 애플리케이션을 실행한 뒤</strong> 다른 터미널에서 수행합니다. 실행 전 <code>grep</code> 결과가 없는 것은 정상입니다. 세 바이너리는 모두 8080을 사용하므로 한 EC2에서는 한 번에 하나씩 실행해 검증합니다.</p></section>
<section class="panel"><h2>한 번에 실행 환경 확인하기</h2><p>EC2에 접속한 상태에서 다음 블록을 실행하면 OS·Architecture·Timezone·EC2 타입·RDS 연결을 한 번에 확인할 수 있습니다. EC2 타입은 Instance Metadata Service에서 읽습니다.</p><pre class="code-block">export RDS_ENDPOINT=&lt;RDS_ENDPOINT&gt;

TOKEN=$(curl -fsS -X PUT   -H 'X-aws-ec2-metadata-token-ttl-seconds: 300'   http://169.254.169.254/latest/api/token)

INSTANCE_TYPE=$(curl -fsS   -H "X-aws-ec2-metadata-token: $TOKEN"   http://169.254.169.254/latest/meta-data/instance-type)

echo '=== OS ==='
grep -E '^(NAME|VERSION)=' /etc/os-release
echo '=== Architecture ==='
uname -m
echo '=== EC2 type ==='
echo "$INSTANCE_TYPE"
echo '=== Timezone ==='
timedatectl show -p Timezone --value
echo '=== RDS TCP 3306 ==='
nc -vz -w 5 "$RDS_ENDPOINT" 3306</pre><p class="tip">기대 결과는 Amazon Linux 2023, <code>x86_64</code>, <code>t3.medium</code>, <code>Asia/Seoul</code>, RDS 3306 연결 성공입니다. 다른 결과가 하나라도 나오면 애플리케이션 실행 전에 EC2 또는 네트워크 구성을 먼저 수정합니다.</p></section>
<section class="panel"><h2>사전 준비</h2><pre class="code-block">sudo timedatectl set-timezone Asia/Seoul
sudo dnf install -y mariadb105 nc jq

cd ~/app-test/bin

# 지급받은 실제 파일명에 맞춰 복사
cp /path/to/user ./user
cp /path/to/product ./product
cp /path/to/stress ./stress
chmod 750 user product stress

file user product stress
sha256sum user product stress</pre><p class="tip"><code>file</code> 결과에서 Linux x86-64 실행 파일인지 확인하고, 세 파일의 SHA-256 값을 기록해 이후 이미지 빌드에 같은 바이너리를 사용했는지 검증합니다.</p></section>
<section class="panel"><h2>RDS 환경변수 설정</h2><p>터미널 기록과 Git 저장소에 비밀번호가 남지 않도록 권한이 제한된 환경 파일을 사용합니다.</p><pre class="code-block">cat &gt; ~/app-test/mysql.env &lt;&lt;'EOF'
MYSQL_USER=appuser
MYSQL_PASSWORD=&lt;STRONG_PASSWORD&gt;
MYSQL_HOST=&lt;RDS_ENDPOINT&gt;
MYSQL_PORT=3306
MYSQL_DBNAME=dev
EOF
chmod 600 ~/app-test/mysql.env

set -a
source ~/app-test/mysql.env
set +a

# 값 자체를 출력하지 않고 설정 여부만 확인
for key in MYSQL_USER MYSQL_PASSWORD MYSQL_HOST MYSQL_PORT MYSQL_DBNAME; do
  test -n "\${!key}" &amp;&amp; echo "$key=SET" || echo "$key=MISSING"
done</pre><p class="tip"><code>MYSQL_HOST</code>에는 RDS endpoint만 입력합니다. <code>mysql://</code>, 포트, 데이터베이스명 또는 MySQL 엔진명을 함께 넣지 않습니다.</p></section>
<section class="panel"><h2>API 검증은 어디서 하나요?</h2><p>4차시는 ALB나 EKS에 배포하기 전의 <strong>EC2 로컬 단독 실행 검증</strong>입니다. 3차시에서 RDS 접속에 사용한 실습용 EC2 한 대에 바이너리를 올리고, 같은 EC2에 터미널을 두 개 열어 실행과 검증을 분리합니다.</p><div class="diagram">내 PC
├── Session Manager/SSH 터미널 A → 실습용 EC2
│      └── USER 또는 PRODUCT 또는 STRESS 실행
└── Session Manager/SSH 터미널 B → 같은 실습용 EC2
       └── curl http://127.0.0.1:8080/... 로 API 검증

실습용 EC2 ── TCP 3306 ──▶ RDS MySQL</div><div class="table-wrap"><table class="network-table"><thead><tr><th>검증 단계</th><th>실행 위치</th><th>접속 주소</th><th>의미</th></tr></thead><tbody><tr><td>4차시 단독 실행</td><td>앱을 실행한 동일 EC2의 터미널 B</td><td><code>http://127.0.0.1:8080</code></td><td>바이너리·환경변수·RDS만 검증</td></tr><tr><td>5차시 Docker</td><td>Docker를 실행한 EC2</td><td><code>http://127.0.0.1:8080</code></td><td>컨테이너 포트 매핑 검증</td></tr><tr><td>9차시 EKS 내부</td><td>클러스터 내부 임시 Pod</td><td>ClusterIP Service DNS</td><td>Deployment·Service 검증</td></tr><tr><td>10차시 이후 외부</td><td>내 PC 또는 외부 테스트 서버</td><td><code>https://&lt;FINAL_ENDPOINT&gt;</code></td><td>실제 사용자·채점 경로 검증</td></tr></tbody></table></div><p class="tip">4차시에서는 EC2의 Public IP나 RDS Endpoint로 API를 호출하지 않습니다. <code>127.0.0.1</code>은 “현재 앱이 실행 중인 같은 EC2”를 뜻합니다. 터미널 B를 새로 열면 아래 공통 테스트 변수를 다시 설정해야 합니다.</p></section><section class="panel"><h2>공통 실행·종료 절차</h2><p><strong>터미널 A:</strong> 실습용 EC2에 접속해 환경변수를 불러오고 앱 하나를 실행합니다. 이 터미널에서 PID와 로그를 관리합니다.</p><pre class="code-block">cd ~/app-test/bin
APP=user                         # product 또는 stress로 변경

./$APP &gt;&gt; ~/app-test/logs/$APP.log 2&gt;&amp;1 &amp;
APP_PID=$!
echo "$APP_PID" &gt; ~/app-test/$APP.pid

sleep 2
curl -i http://127.0.0.1:8080/healthcheck
ss -lntp | grep :8080
tail -n 30 ~/app-test/logs/$APP.log

# 해당 앱 검증이 끝나면 반드시 종료
kill "$(cat ~/app-test/$APP.pid)"
rm -f ~/app-test/$APP.pid
sleep 1
! ss -lntp | grep -q :8080 &amp;&amp; echo 'port 8080 released'</pre></section>
<section class="panel"><h2>공통 테스트 변수</h2><p><strong>터미널 B:</strong> 같은 실습용 EC2에 새 Session Manager/SSH 세션을 열고 아래 변수를 설정합니다. 이후 모든 <code>curl</code> 명령은 이 터미널에서 실행합니다.</p><pre class="code-block">BASE=http://127.0.0.1:8080
REQUEST_ID=999999999999
UUID=7c5a3c6a-758f-4bc5-9bdf-3e573a0ad729
EMAIL=dbdump500001@example.org
PRODUCT_ID=dbdump500001</pre></section>
<section class="panel"><h2>USER API 검증</h2><p><strong>실행 장소:</strong> 터미널 A에서 <code>user</code> 바이너리가 실행 중인 상태로, 같은 EC2의 터미널 B에서 수행합니다. 먼저 <code>curl -i "$BASE/healthcheck"</code>가 200인지 확인합니다.</p><pre class="code-block"># POST: 사용자 생성 → 201
curl -i -X POST "$BASE/v1/user" \
  -H 'Content-Type: application/json' \
  -d "{\"requestid\":\"$REQUEST_ID\",\"uuid\":\"$UUID\",\"username\":\"practice-user-001\",\"email\":\"practice-user-001@example.org\"}"

# GET: dump 사용자 조회 → 200
curl -i -G "$BASE/v1/user" \
  --data-urlencode "email=$EMAIL" \
  --data-urlencode "requestid=$REQUEST_ID" \
  --data-urlencode "uuid=$UUID"</pre><p class="tip">지급 dump와 충돌하지 않는 고유한 username/email을 POST 테스트에 사용합니다. 반복 테스트 시 같은 값으로 인한 중복 오류와 시스템 장애를 구분하세요.</p></section>
<section class="panel"><h2>PRODUCT API 검증</h2><p><strong>실행 장소:</strong> USER를 종료한 뒤 터미널 A에서 <code>product</code>를 실행하고, 같은 EC2의 터미널 B에서 수행합니다. USER가 아직 8080을 사용 중이면 PRODUCT를 실행할 수 없습니다.</p><pre class="code-block"># POST: 상품 생성 → 201
curl -i -X POST "$BASE/v1/product" \
  -H 'Content-Type: application/json' \
  -d "{\"requestid\":\"$REQUEST_ID\",\"uuid\":\"$UUID\",\"id\":\"practice-product-001\",\"name\":\"practice-product\",\"price\":1234}"

# GET: 상품 조회 → 200
curl -i -G "$BASE/v1/product" \
  --data-urlencode 'id=practice-product-001' \
  --data-urlencode "requestid=$REQUEST_ID" \
  --data-urlencode "uuid=$UUID"

# 작은 이미지 준비 및 multipart PUT → 200
printf 'practice-image' &gt; ~/app-test/images/small.jpg
curl -i -X PUT "$BASE/v1/product" \
  -F "requestid=$REQUEST_ID" \
  -F "uuid=$UUID" \
  -F 'id=practice-product-001' \
  -F 'image=@/home/ec2-user/app-test/images/small.jpg;type=image/jpeg'</pre><p class="tip">실제 지급 바이너리의 multipart 필드명이 별도 자료에 지정되어 있다면 그 값을 우선합니다. 업로드 후 DB의 <code>image_path</code> 변경과 S3 객체 생성 여부는 11차시에서 함께 검증합니다.</p></section>
<section class="panel"><h2>STRESS API 검증</h2><p><strong>실행 장소:</strong> PRODUCT를 종료한 뒤 터미널 A에서 <code>stress</code>를 실행하고, 같은 EC2의 터미널 B에서 기능 확인 요청을 1회 실행합니다.</p><pre class="code-block">curl -i -X POST "$BASE/v1/stress" \
  -H 'Content-Type: application/json' \
  -d "{\"requestid\":\"$REQUEST_ID\",\"uuid\":\"$UUID\",\"length\":256}"</pre><p class="tip">STRESS 요청은 CPU 사용량을 높일 수 있습니다. 기능 확인에는 1회만 호출하고 반복 부하는 14차시 성능 측정에서 제한된 시간 동안 수행합니다.</p></section>
<section class="panel"><h2>403·404 사전 확인</h2><p><strong>실행 장소:</strong> 검사하려는 앱이 터미널 A에서 실행 중일 때 같은 EC2의 터미널 B에서 호출합니다. 아래 USER 예시는 USER 실행 상태에서 검사합니다.</p><pre class="code-block"># 정상 API지만 requestid/uuid 누락 → 403 기대
curl -s -o /dev/null -w 'invalid=%{http_code}\n' \
  "$BASE/v1/user?email=$EMAIL"

# 존재하지 않는 API → 404 기대
curl -s -o /dev/null -w 'missing=%{http_code}\n' \
  "$BASE/v1/none"</pre><p>Ingress 또는 WAF에서 최종 규칙을 적용하기 전이라 바이너리 단독 실행 결과가 다를 수 있습니다. 이 경우 결과를 기록하고 12차시에서 최종 403/404를 구성합니다.</p></section>
<section class="panel"><h2>응답시간 측정</h2><p><strong>실행 장소:</strong> 각 앱이 실행 중인 동안 같은 EC2의 터미널 B에서 측정합니다. 이 값은 네트워크 구간이 짧은 로컬 기준선이며 최종 채점 기준은 10차시 이후 외부 Endpoint에서 다시 측정합니다.</p><pre class="code-block">curl -s -o /dev/null \
  -w 'code=%{http_code} total=%{time_total}s\n' \
  "$BASE/healthcheck"

# 10회 간단 측정
for i in $(seq 1 10); do
  curl -s -o /dev/null -w '%{time_total}\n' "$BASE/healthcheck"
done</pre><div class="table-wrap"><table class="network-table"><thead><tr><th>대상</th><th>최소 가용성 기준</th><th>서비스 목표</th></tr></thead><tbody><tr><td>USER</td><td>5초 이하</td><td>0.2초 이하</td></tr><tr><td>PRODUCT</td><td>5초 이하</td><td>0.2초 이하</td></tr><tr><td>STRESS</td><td>5초 이하</td><td>1초 이하</td></tr><tr><td>Image</td><td>5초 이하</td><td>5초 이하</td></tr></tbody></table></div></section>
<section class="panel"><h2>로그 확인 포인트</h2><div class="check-grid"><div class="check-item"><b>Request</b>method, path, requestid, uuid</div><div class="check-item"><b>Response</b>status code와 응답시간</div><div class="check-item"><b>Database</b>연결 오류와 SQL 오류</div><div class="check-item"><b>Process</b>panic, exit, memory 오류</div></div><pre class="code-block">grep -Ei 'error|panic|timeout|denied|duplicate' ~/app-test/logs/*.log
tail -F ~/app-test/logs/user.log</pre></section>
<section class="panel"><h2>오류별 해결표</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>증상</th><th>원인 후보</th><th>확인 방법</th></tr></thead><tbody>
<tr><td>Permission denied</td><td>실행 권한 없음</td><td><code>chmod 750 &lt;binary&gt;</code></td></tr>

<tr><td>Access denied for user</td><td>DB 계정·권한 오류</td><td>MYSQL_USER/PASSWORD 및 GRANT 확인</td></tr>
<tr><td>즉시 프로세스 종료</td><td>필수 환경변수 누락</td><td>로그와 환경변수 SET 여부 확인</td></tr>
</tbody></table></div></section>
<section class="panel"><h2>최종 정리 체크리스트</h2><ul><li>세 앱의 healthcheck와 핵심 API 응답코드를 기록했습니다.</li><li>로그 파일과 바이너리 SHA-256 값을 보관했습니다.</li><li>실행 중인 STRESS 요청과 애플리케이션 프로세스를 모두 종료했습니다.</li><li><code>mysql.env</code> 권한이 600이며 Git에 포함되지 않았습니다.</li><li>테스트용 EC2가 더 이상 필요 없다면 종료가 아니라 <strong>삭제(terminate)</strong>했습니다.</li></ul></section>`;}

<section class="panel"><h2>컨테이너화 목표</h2><p>4차시에서 검증한 동일 바이너리를 변경 없이 이미지에 넣고, 설정은 실행 시 주입합니다. 이미지 자체에는 DB 비밀번호, RDS endpoint, AWS Access Key를 저장하지 않습니다.</p><div class="check-grid"><div class="check-item"><b>재현성</b>어디서 실행해도 같은 파일과 시작 명령</div><div class="check-item"><b>호환성</b>Linux <code>amd64</code> 이미지</div><div class="check-item"><b>보안</b>비루트 사용자와 Secret 외부 주입</div><div class="check-item"><b>운영성</b>stdout/stderr 로그와 TCP 8080</div></div></section>
<section class="panel"><h2>Docker 이미지의 출발점</h2><p>ECR에 넣을 “이미지 파일”을 내려받는 것이 아닙니다. 실행 바이너리와 Dockerfile로 Docker 이미지를 직접 빌드한 뒤, 다음 차시에서 그 이미지를 ECR에 Push합니다.</p><pre class="code-block">user · product · stress 바이너리
        ↓ Dockerfile로 포장
로컬 Docker 이미지
        ↓ 6차시에서 Push
ECR Private Repository</pre><div class="table-wrap"><table class="network-table"><thead><tr><th>구분</th><th>언제 사용하나</th><th>반드시 기억할 점</th></tr></thead><tbody><tr><td><strong>공식 바이너리</strong></td><td>대회·채점</td><td>대회 당일 주최 측에서 받은 <code>user</code>·<code>product</code>·<code>stress</code>를 사용합니다.</td></tr><tr><td>연습용 바이너리</td><td>현재 실습</td><td>Docker·ECR·EKS 연습을 위한 대체 프로그램이며 실제 채점용이 아닙니다.</td></tr><tr><td>연습용 Go 소스</td><td>코드 확인·직접 빌드</td><td>교육용 구현이며 공식 애플리케이션의 소스가 아닙니다.</td></tr></tbody></table></div><p class="tip">공식 바이너리는 Amazon Linux 2023의 <code>linux/amd64</code> 환경에서 검증되었고 TCP 8080을 사용합니다. 공식 파일이 지급되면 Dockerfile과 이후 명령은 그대로 두고 바이너리 세 개만 교체합니다.</p></section>
<section class="panel"><h2>실습 파일 다운로드</h2><p>공식 바이너리가 아직 없다면 아래 연습용 파일로 전체 과정을 진행합니다. 바이너리만 필요한 경우 첫 번째 ZIP만 받으면 됩니다.</p><div class="check-grid"><a class="check-item" href="downloads/lesson05-practice-apps-linux-amd64.zip" download><b>연습용 실행 바이너리</b>linux/amd64 USER·PRODUCT·STRESS</a><a class="check-item" href="downloads/lesson05-practice-apps-source.zip" download><b>연습용 Go 소스</b>소스·Dockerfile·빌드 스크립트</a></div><pre class="code-block">mkdir -p ~/app-test/bin
cd ~/app-test

curl -fLO https://rani0380.github.io/2026_nationalskills/cloud-course/downloads/lesson05-practice-apps-linux-amd64.zip
unzip lesson05-practice-apps-linux-amd64.zip -d bin

chmod 750 bin/user bin/product bin/stress
ls -lh bin
file bin/user bin/product bin/stress</pre><p class="tip"><code>file</code> 결과에서 세 파일 모두 <code>ELF 64-bit</code>와 <code>x86-64</code>가 보여야 합니다. <code>HTML document</code>가 나오면 ZIP 대신 오류 페이지를 받은 것이므로 URL과 HTTP 응답을 확인합니다.</p></section>
<section class="panel"><h2>공식 바이너리를 받았을 때</h2><p>대회 당일에는 연습용 파일을 삭제하거나 별도 폴더에 보관한 다음 공식 파일을 <code>~/app-test/bin</code>에 배치합니다. 전송 중 파일이 바뀌지 않았는지도 기록합니다.</p><pre class="code-block">cd ~/app-test
chmod 750 bin/user bin/product bin/stress

file bin/user bin/product bin/stress
sha256sum bin/user bin/product bin/stress

# 실행 포맷 확인 결과
# ELF 64-bit LSB executable, x86-64 ...</pre><div class="check-grid"><div class="check-item"><b>파일명</b>확장자 없이 user·product·stress</div><div class="check-item"><b>Architecture</b>x86-64 / linux/amd64</div><div class="check-item"><b>실행 권한</b><code>chmod 750</code></div><div class="check-item"><b>무결성 기록</b>세 파일의 SHA-256 보관</div></div></section>
<section class="panel"><h2>이미지 구성 원칙</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>항목</th><th>권장 설정</th><th>이유</th></tr></thead><tbody>
<tr><td>Runtime base</td><td>Amazon Linux 2023 minimal</td><td>지급 바이너리 검증 환경과 호환</td></tr>
<tr><td>Platform</td><td><code>linux/amd64</code></td><td>x86 기반 EKS Node에서 실행</td></tr>
<tr><td>Process user</td><td>UID <code>10001</code></td><td>root 권한 최소화</td></tr>
<tr><td>Listen port</td><td>TCP <code>8080</code></td><td>애플리케이션 고정 포트</td></tr>
<tr><td>Configuration</td><td><code>--env-file</code> 또는 K8s Secret</td><td>이미지와 설정 분리</td></tr>
<tr><td>Logs</td><td>stdout / stderr</td><td>Docker·CloudWatch 수집 가능</td></tr>
<tr><td>Image tag</td><td>변경 가능한 태그 + commit SHA</td><td>배포 버전 추적과 롤백</td></tr>
</tbody></table></div></section>
<section class="panel"><h2>빌드 컨텍스트 준비</h2><pre class="code-block">cd ~/app-test
mkdir -p docker/user docker/product docker/stress

# 4차시에서 검증한 바이너리를 각 컨텍스트에 application 이름으로 복사
cp bin/user    docker/user/application
cp bin/product docker/product/application
cp bin/stress  docker/stress/application

sha256sum bin/user docker/user/application
sha256sum bin/product docker/product/application
sha256sum bin/stress docker/stress/application</pre><p class="tip">원본과 복사본의 SHA-256이 같아야 합니다. 빌드 컨텍스트에는 해당 앱 바이너리와 Dockerfile만 두어 불필요한 파일이나 자격증명이 이미지에 들어가지 않게 합니다.</p></section>
<section class="panel"><h2>공통 Dockerfile</h2><p>아래 Dockerfile을 <code>docker/user</code>, <code>docker/product</code>, <code>docker/stress</code>에 각각 저장합니다.</p><pre class="code-block">FROM public.ecr.aws/amazonlinux/amazonlinux:2023-minimal

WORKDIR /app
COPY --chown=10001:10001 application /app/application
RUN chmod 0550 /app/application

USER 10001:10001
EXPOSE 8080
ENV TZ=Asia/Seoul

ENTRYPOINT ["/app/application"]</pre><p class="tip">지급 바이너리가 동적 라이브러리를 요구한다면 <code>ldd application</code> 결과를 확인하고 필요한 런타임 패키지만 추가합니다. 무작정 개발 도구 전체를 설치하지 않습니다.</p></section>
<section class="panel"><h2>.dockerignore</h2><p>각 빌드 컨텍스트에 아래 파일을 둡니다. 현재 컨텍스트에는 application과 Dockerfile만 포함시킵니다.</p><pre class="code-block"># .dockerignore
*
!application
!Dockerfile</pre></section>
<section class="panel"><h2>Docker 설치와 Buildx 확인</h2><pre class="code-block">sudo dnf install -y docker
sudo systemctl enable --now docker
sudo usermod -aG docker ec2-user

# 그룹 변경은 새 로그인 후 적용
newgrp docker
docker version
docker buildx version</pre><p class="tip">대회에서 제공되는 작업 환경에 Docker가 이미 있으면 재설치하지 않습니다. Docker daemon 소켓을 모든 사용자에게 열기 위해 <code>chmod 666 /var/run/docker.sock</code>을 사용하는 방식은 피합니다.</p></section>
<section class="panel"><h2>세 이미지 빌드</h2><pre class="code-block">cd ~/app-test

for app in user product stress; do

</tbody></table></div></section>
<section class="panel"><h2>ECR 전달 전 완료 기준</h2><ul><li>세 이미지의 OS/Architecture가 <code>linux/amd64</code>입니다.</li><li>세 컨테이너 모두 비루트 UID 10001로 실행됩니다.</li><li>healthcheck와 핵심 API가 4차시 결과와 동일합니다.</li><li><code>docker logs</code>에서 access log를 볼 수 있습니다.</li><li>이미지 history, config, layer에 DB·AWS 비밀정보가 없습니다.</li><li>테스트 컨테이너를 모두 종료했으며 불필요한 이미지 복제본이 없습니다.</li><li>Commit SHA 태그를 기록해 6차시 ECR push에 사용할 준비가 됐습니다.</li></ul><p class="tip">여기까지는 EC2의 로컬 Docker 이미지 준비 단계입니다. Repository 생성·로그인·태그·Push는 다음 차시에서 이어집니다.</p><p><a class="btn primary" href="lesson.html?lesson=06">6차시 ECR 이미지 저장소로 이동 →</a></p></section>`;}

<section class="panel"><h2>ECR 실습 목표</h2><p>5차시의 USER·PRODUCT·STRESS 이미지를 서울 리전의 Private ECR에 저장하고, 태그가 아닌 digest까지 검증해 7~9차시 EKS 배포에 사용할 이미지 주소를 확정합니다.</p><div class="check-grid"><div class="check-item"><b>Repository</b>앱별 1개, 총 3개</div><div class="check-item"><b>Security</b>Immutable tag, scan on push</div><div class="check-item"><b>Traceability</b>Commit SHA와 digest 기록</div><div class="check-item"><b>EKS Pull</b>Node role에 PullOnly 권한</div></div></section>
<section class="panel"><h2>권장 저장소 계획</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>애플리케이션</th><th>Repository</th><th>로컬 이미지</th><th>배포 태그</th></tr></thead><tbody>
<tr><td>USER</td><td><code>apdev/user</code></td><td><code>user:local</code></td><td>Commit SHA</td></tr>
<tr><td>PRODUCT</td><td><code>apdev/product</code></td><td><code>product:local</code></td><td>Commit SHA</td></tr>
<tr><td>STRESS</td><td><code>apdev/stress</code></td><td><code>stress:local</code></td><td>Commit SHA</td></tr>
</tbody></table></div><p class="tip">저장소 이름은 대회에서 고정하지 않았지만 소문자와 동일한 namespace를 사용하면 관리가 쉽습니다. 필요하지 않은 추가 저장소를 만들지 않습니다.</p></section>
<section class="panel"><h2>권한 분리</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>주체</th><th>필요 권한</th><th>금지 사항</th></tr></thead><tbody>
<tr><td>빌드·Push EC2 Role</td><td>ECR 인증과 <code>apdev/*</code> upload 권한</td><td>개인 Access Key를 파일에 저장</td></tr>
<tr><td>EKS Node Role</td><td><code>AmazonEC2ContainerRegistryPullOnly</code></td><td>Push·Delete 권한 부여</td></tr>
<tr><td>Pod</td><td>이미지 pull 권한 불필요</td><td>ECR 권한을 앱 ServiceAccount에 중복 부여</td></tr>
</tbody></table></div><p class="tip">ECR에서 이미지를 가져오는 주체는 일반적으로 kubelet이 실행되는 Worker Node입니다. AWS 공식 EKS 문서는 Node IAM Role에 <code>AmazonEC2ContainerRegistryPullOnly</code> 또는 동등한 최소 권한을 요구합니다.</p></section>
<section class="panel"><h2>AWS CLI 사전 확인</h2><pre class="code-block">export AWS_REGION=ap-northeast-2
export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
export REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

aws sts get-caller-identity
aws configure get region
echo "REGISTRY=$REGISTRY"

docker image inspect user:local    --format '{{.Os}}/{{.Architecture}}'
docker image inspect product:local --format '{{.Os}}/{{.Architecture}}'
docker image inspect stress:local  --format '{{.Os}}/{{.Architecture}}'</pre><p class="tip">세 이미지 모두 <code>linux/amd64</code>여야 합니다. 계정 ID와 리전을 직접 하드코딩하지 않고 STS와 환경변수로 얻습니다.</p></section>
<section class="panel"><h2>Private Repository 3개 생성</h2><pre class="code-block">for repo in apdev/user apdev/product apdev/stress; do
  aws ecr create-repository \
    --repository-name "$repo" \
    --region "$AWS_REGION" \
    --image-tag-mutability IMMUTABLE \
    --image-scanning-configuration scanOnPush=true \
    --encryption-configuration encryptionType=AES256 \
    --tags Key=Project,Value=apdev Key=ManagedBy,Value=student
done

aws ecr describe-repositories \
  --repository-names apdev/user apdev/product apdev/stress \
  --region "$AWS_REGION" \
  --query 'repositories[].{name:repositoryName,uri:repositoryUri,immutable:imageTagMutability,scan:imageScanningConfiguration.scanOnPush}' \
  --output table</pre><p class="tip">현재 AWS CLI는 <code>MUTABLE</code>, <code>IMMUTABLE</code>과 exclusion 방식도 지원합니다. 이 실습은 배포 태그 덮어쓰기를 막기 위해 단순한 <code>IMMUTABLE</code>을 사용합니다.</p></section>
<section class="panel"><h2>Docker를 ECR에 인증</h2><pre class="code-block">aws ecr get-login-password --region "$AWS_REGION" | \
  docker login --username AWS --password-stdin "$REGISTRY"

docker system info | grep -i registry || true</pre><p class="tip">Private ECR 인증 토큰은 제한된 시간 동안만 유효하므로 인증 오류가 나면 명령을 다시 실행합니다. <code>aws ecr get-login</code>의 결과를 복사하거나 비밀번호를 명령행에 직접 노출하지 않습니다.</p></section>
<section class="panel"><h2>Commit SHA 태그와 Push</h2><pre class="code-block">IMAGE_TAG=$(git rev-parse --short HEAD 2&gt;/dev/null || date +%Y%m%d%H%M%S)

echo "IMAGE_TAG=$IMAGE_TAG"
for app in user product stress; do
  ECR_IMAGE=$REGISTRY/apdev/$app:$IMAGE_TAG
  docker tag "$app:local" "$ECR_IMAGE"
  docker push "$ECR_IMAGE"
done</pre><p class="tip"><code>IMMUTABLE</code> 저장소에 같은 태그를 다시 push하면 실패하는 것이 정상입니다. 바이너리나 Dockerfile이 변경되면 새 Commit SHA 태그를 사용합니다.</p></section>
<section class="panel"><h2>Push 결과와 Digest 검증</h2><pre class="code-block">for repo in apdev/user apdev/product apdev/stress; do
  aws ecr describe-images \
    --repository-name "$repo" \
    --image-ids imageTag="$IMAGE_TAG" \
    --region "$AWS_REGION" \
    --query 'imageDetails[0].{tags:imageTags,digest:imageDigest,size:imageSizeInBytes,pushed:imagePushedAt}' \
    --output table
done

# 배포 기록 파일 생성
: &gt; ~/app-test/ecr-images.txt
for app in user product stress; do
  DIGEST=$(aws ecr describe-images \
    --repository-name "apdev/$app" \
    --image-ids imageTag="$IMAGE_TAG" \
    --query 'imageDetails[0].imageDigest' --output text \
    --region "$AWS_REGION")
  echo "$app=$REGISTRY/apdev/$app@$DIGEST" | tee -a ~/app-test/ecr-images.txt
done</pre><p class="tip">태그는 사람이 읽기 쉽지만 digest는 이미지 내용을 고정합니다. 운영 Deployment에는 <code>repository@sha256:...</code> 형식을 사용하면 같은 이미지임을 확실히 보장할 수 있습니다.</p></section>
<section class="panel"><h2>Pull 재검증</h2><pre class="code-block"># 로컬 태그를 지운 뒤 ECR에서 다시 받아 전송 경로 확인
for app in user product stress; do
  docker image rm "$REGISTRY/apdev/$app:$IMAGE_TAG" || true
  docker pull --platform linux/amd64 "$REGISTRY/apdev/$app:$IMAGE_TAG"
  docker image inspect "$REGISTRY/apdev/$app:$IMAGE_TAG" \
    --format '{{.RepoDigests}} os={{.Os}} arch={{.Architecture}}'
done</pre><p class="tip">로컬에 남은 이미지 때문에 pull 검증을 건너뛰지 않도록 ECR 태그만 제거한 뒤 다시 받습니다. <code>user:local</code> 같은 원본 태그는 삭제할 필요가 없습니다.</p></section>
<section class="panel"><h2>Image Scan 결과 확인</h2><pre class="code-block">for repo in apdev/user apdev/product apdev/stress; do
  echo "=== $repo ==="
  aws ecr describe-image-scan-findings \
    --repository-name "$repo" \
    --image-id imageTag="$IMAGE_TAG" \
    --region "$AWS_REGION" \
    --query '{status:imageScanStatus.status,severity:imageScanFindings.findingSeverityCounts}' \
    --output table
done</pre><div class="table-wrap"><table class="network-table"><thead><tr><th>결과</th><th>조치</th></tr></thead><tbody><tr><td>COMPLETE, 치명적 취약점 없음</td><td>digest를 배포 후보로 기록</td></tr><tr><td>IN_PROGRESS</td><td>잠시 후 다시 조회</td></tr><tr><td>HIGH/CRITICAL 발견</td><td>Base image 업데이트 후 새 태그로 재빌드</td></tr><tr><td>UNSUPPORTED_IMAGE</td><td>Manifest와 OS/Architecture 확인</td></tr></tbody></table></div></section>
<section class="panel"><h2>Lifecycle Policy</h2><p>실습 중 생기는 untagged 이미지가 무한히 쌓이지 않도록 각 저장소에서 최신 1개만 유지하는 정책 예시입니다. 적용 전 preview로 삭제 대상을 확인하세요.</p><pre class="code-block">cat &gt; /tmp/ecr-lifecycle.json &lt;&lt;'EOF'
{
  "rules": [
    {
      "rulePriority": 1,
      "description": "Keep one untagged image",
      "selection": {
        "tagStatus": "untagged",
        "countType": "imageCountMoreThan",
        "countNumber": 1
      },
      "action": { "type": "expire" }
    }
  ]
}
EOF

for repo in apdev/user apdev/product apdev/stress; do
  aws ecr put-lifecycle-policy \
    --repository-name "$repo" \
    --lifecycle-policy-text file:///tmp/ecr-lifecycle.json \
    --region "$AWS_REGION"
done</pre><p class="tip">ECR lifecycle action은 즉시 실행되지 않을 수 있습니다. 태그된 배포 이미지를 삭제하는 공격적인 정책은 대회 중 사용하지 않습니다.</p></section>
<section class="panel"><h2>EKS Node Role Pull 권한 확인</h2><pre class="code-block">NODE_ROLE_NAME=&lt;EKS_NODE_ROLE_NAME&gt;

aws iam list-attached-role-policies \
  --role-name "$NODE_ROLE_NAME" \
  --query 'AttachedPolicies[].PolicyArn' \
  --output text | tr '\t' '\n' | \
  grep AmazonEC2ContainerRegistryPullOnly</pre><p>정책이 없다면 Node Role에 연결합니다.</p><pre class="code-block">aws iam attach-role-policy \
  --role-name "$NODE_ROLE_NAME" \
  --policy-arn arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly</pre><p class="tip">예전 구성에서 사용하던 더 넓은 ReadOnly 정책보다 현재 공식 문서의 PullOnly 정책을 우선합니다. Node Role에는 push 권한이 필요하지 않습니다.</p></section>
<section class="panel"><h2>Private Subnet의 ECR 통신</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>방식</th><th>필요 구성</th><th>선택 기준</th></tr></thead><tbody><tr><td>기존 NAT 경로</td><td>Private App Route → NAT, HTTPS 443</td><td>2차시 NAT를 이미 운영할 때 단순</td></tr><tr><td>VPC Endpoint</td><td>ECR API·ECR DKR Interface + S3 Gateway</td><td>인터넷 경로를 피할 때, Endpoint 비용 고려</td></tr></tbody></table></div><p class="tip">두 방식을 이유 없이 동시에 추가하지 않습니다. 대회 비용과 기존 네트워크 구성을 보고 하나를 선택하고, Worker Node에서 ECR HTTPS 443 및 이미지 layer를 위한 S3 경로가 열려 있어야 합니다.</p></section>
<section class="panel"><h2>오류별 해결표</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>증상</th><th>주요 원인</th><th>확인·해결</th></tr></thead><tbody>
<tr><td>no basic auth credentials</td><td>로그인 누락·토큰 만료</td><td><code>get-login-password</code> 재실행</td></tr>
<tr><td>repository does not exist</td><td>이름·리전·계정 불일치</td><td>REGISTRY와 <code>describe-repositories</code> 확인</td></tr>
<tr><td>tag already exists</td><td>Immutable 태그 재사용</td><td>새 Commit SHA 태그 사용</td></tr>
<tr><td>denied: not authorized</td><td>Push Role 권한 부족</td><td>ECR upload action과 repository ARN 확인</td></tr>
<tr><td>ImagePullBackOff</td><td>Node Role 또는 NAT/Endpoint 문제</td><td>Pod Event, PullOnly 정책, HTTPS 경로 확인</td></tr>
<tr><td>manifest does not match</td><td>Architecture 불일치</td><td><code>linux/amd64</code>로 재빌드</td></tr>
</tbody></table></div></section>
<section class="panel"><h2>7차시 전달 체크리스트</h2><ul><li>서울 리전에 ECR Private Repository가 정확히 3개 있습니다.</li><li>세 저장소는 Immutable tag와 scan on push가 활성화되어 있습니다.</li><li>USER·PRODUCT·STRESS 이미지의 Commit SHA 태그와 digest를 기록했습니다.</li><li>이미지를 삭제한 뒤 ECR에서 pull하여 <code>linux/amd64</code>를 재확인했습니다.</li><li>치명적 스캔 결과를 확인하고 필요한 경우 새 이미지로 교체했습니다.</li><li>EKS Node Role에 <code>AmazonEC2ContainerRegistryPullOnly</code>가 있습니다.</li><li>Private App Subnet에서 ECR/S3로 나가는 경로가 하나만 명확히 구성됐습니다.</li><li>불필요한 repository와 중복 태그를 만들지 않았습니다.</li></ul><p>공식 참고: <a href="https://docs.aws.amazon.com/AmazonECR/latest/userguide/repository-create.html">ECR repository 생성</a>, <a href="https://docs.aws.amazon.com/AmazonECR/latest/userguide/example_ecr_GettingStarted_078_section.html">ECR 인증·Push</a>, <a href="https://docs.aws.amazon.com/eks/latest/userguide/create-node-role.html">EKS Node IAM Role</a></p></section>`;}

<section class="panel"><h2>Cluster IAM Role 생성</h2><pre class="code-block">cat &gt; /tmp/eks-cluster-trust.json &lt;&lt;'EOF'
{
  "Version": "2012-10-17",
  "Statement": [{
    "Effect": "Allow",
    "Principal": {"Service": "eks.amazonaws.com"},
    "Action": "sts:AssumeRole"
  }]
}
EOF

aws iam create-role \
  --role-name apdev-eks-cluster-role \
  --assume-role-policy-document file:///tmp/eks-cluster-trust.json

aws iam attach-role-policy \
  --role-name apdev-eks-cluster-role \
  --policy-arn arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

export CLUSTER_ROLE_ARN=$(aws iam get-role \
  --role-name apdev-eks-cluster-role \
  --query 'Role.Arn' --output text)</pre><p class="tip">Cluster Role의 신뢰 주체는 <code>eks.amazonaws.com</code>입니다. Node Role과 Cluster Role을 하나로 합치지 않습니다.</p></section>
<section class="panel"><h2>Node IAM Role 생성</h2><pre class="code-block">cat &gt; /tmp/eks-node-trust.json &lt;&lt;'EOF'
{
  "Version": "2012-10-17",
  "Statement": [{
    "Effect": "Allow",
    "Principal": {"Service": "ec2.amazonaws.com"},
    "Action": "sts:AssumeRole"
  }]
}
EOF

aws iam create-role \
  --role-name apdev-eks-node-role \
  --assume-role-policy-document file:///tmp/eks-node-trust.json

aws iam attach-role-policy \
  --role-name apdev-eks-node-role \
  --policy-arn arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
aws iam attach-role-policy \
  --role-name apdev-eks-node-role \
  --policy-arn arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly

# 단순 실습 구성: CNI 권한을 Node Role에 연결
# 운영 환경에서는 VPC CNI 전용 Pod Identity/IRSA Role 권장
aws iam attach-role-policy \
  --role-name apdev-eks-node-role \
  --policy-arn arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy

export NODE_ROLE_ARN=$(aws iam get-role \
  --role-name apdev-eks-node-role \
  --query 'Role.Arn' --output text)</pre><p class="tip">현재 AWS 공식 문서는 Node Role에 <code>AmazonEKSWorkerNodePolicy</code>와 <code>AmazonEC2ContainerRegistryPullOnly</code> 또는 동등한 최소 권한을 요구합니다. CNI 권한은 별도 Pod Identity/IRSA Role이 권장되지만 제한시간 실습에서는 Node Role 연결 후 나중에 분리할 수 있습니다.</p></section>
<section class="panel"><h2>EKS Cluster 생성</h2><pre class="code-block">aws eks create-cluster \
  --name "$CLUSTER_NAME" \
  --region "$AWS_REGION" \

  --tags Project=apdev,ManagedBy=student

  --name "$CLUSTER_NAME" \
  --region "$AWS_REGION"

aws eks describe-cluster \
  --name "$CLUSTER_NAME" \
  --region "$AWS_REGION" \
  --query 'cluster.{status:status,version:version,endpoint:endpoint,private:resourcesVpcConfig.endpointPrivateAccess,public:resourcesVpcConfig.endpointPublicAccess,cidrs:resourcesVpcConfig.publicAccessCidrs,sg:resourcesVpcConfig.clusterSecurityGroupId}' \
  --output yaml</pre><p class="tip">Public Endpoint를 <code>0.0.0.0/0</code>으로 열지 않습니다. 운영 위치가 바뀌면 현재 공인 IP /32를 갱신하거나 VPC 내부 관리 환경을 사용합니다. Private Endpoint에는 VPC DNS support와 hostnames가 필요합니다.</p></section>

<section class="panel"><h2>Managed Node Group 생성</h2><pre class="code-block">aws eks create-nodegroup \

  --query 'Reservations[0].Instances[0].SecurityGroups[].GroupId' \

echo "NODE_INSTANCE_ID=$NODE_INSTANCE_ID"

<section class="panel"><h2>실습 목표와 Kubernetes 객체 관계</h2><div class="diagram">Deployment

<section class="panel"><h2>1. 사전 점검과 작업 디렉터리</h2><pre class="code-block">export AWS_REGION=ap-northeast-2

<section class="panel"><h2>3. ConfigMap·Secret 준비</h2><pre class="code-block">cat &gt; app.env &lt;&lt;'EOF'

  --from-literal=MYSQL_HOST="$(grep '^MYSQL_HOST=' app.env | cut -d= -f2-)" \
  --from-literal=MYSQL_PORT=3306 \
  --from-literal=MYSQL_DBNAME=dev \
  --dry-run=client -o yaml | kubectl apply -f -

kubectl create secret generic user-db-secret \
  --from-literal=MYSQL_USER="$(grep '^MYSQL_USER=' app.env | cut -d= -f2-)" \
  --from-literal=MYSQL_PASSWORD="$(grep '^MYSQL_PASSWORD=' app.env | cut -d= -f2-)" \
  --dry-run=client -o yaml | kubectl apply -f -

kubectl get configmap user-config
kubectl get secret user-db-secret</pre><p class="tip"><code>app.env</code>와 Secret YAML을 Git에 커밋하지 않습니다. <code>kubectl get secret -o yaml</code>의 값은 암호화가 아니라 Base64 표현이므로 화면 캡처나 제출 파일에 노출하지 않습니다.</p></section>
<section class="panel"><h2>4. USER Deployment YAML</h2><pre class="code-block">cat &gt; 10-user-deployment.yaml &lt;&lt;'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  namespace: apdev
  labels:
    app: user
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: &lt;ACCOUNT_ID&gt;.dkr.ecr.ap-northeast-2.amazonaws.com/user@sha256:&lt;DIGEST&gt;
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: user-config
            - secretRef:
                name: user-db-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
EOF</pre><p class="tip">ECR URI는 변경 가능한 태그보다 6차시에 기록한 digest를 사용합니다. 앱이 시작할 때 DB 연결에 시간이 걸릴 수 있어 <code>startupProbe</code>가 통과하기 전에는 liveness/readiness 판단을 유예합니다.</p></section>
<section class="panel"><h2>5. ClusterIP Service YAML</h2><pre class="code-block">cat &gt; 20-user-service.yaml &lt;&lt;'EOF'
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: apdev
spec:
  type: ClusterIP
  selector:
    app: user
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
EOF</pre><div class="table-wrap"><table class="network-table"><thead><tr><th>필드</th><th>값</th><th>연결 대상</th></tr></thead><tbody>
<tr><td>Deployment selector</td><td><code>app: user</code></td><td>Pod template label</td></tr>
<tr><td>Service selector</td><td><code>app: user</code></td><td>같은 label의 Ready Pod</td></tr>
<tr><td>Service port</td><td><code>8080</code></td><td>클러스터 내부 호출 포트</td></tr>
<tr><td>targetPort</td><td><code>http</code></td><td>Container port 이름</td></tr>
</tbody></table></div></section>
<section class="panel"><h2>6. 적용과 Rollout 확인</h2><pre class="code-block">kubectl apply -f 10-user-deployment.yaml
kubectl apply -f 20-user-service.yaml

kubectl rollout status deployment/user-deployment \
  --timeout=5m
kubectl get deployment,replicaset,pod,service -o wide
kubectl get pod -l app=user --show-labels
kubectl describe deployment user-deployment</pre><p>정상 기준은 Deployment의 <code>READY 2/2</code>, 두 Pod의 <code>READY 1/1</code>과 <code>STATUS Running</code>입니다. Rollout timeout이 발생하면 다음 단계로 넘어가지 말고 Event와 로그를 먼저 확인합니다.</p></section>
<section class="panel"><h2>7. Service Endpoint 검증</h2><pre class="code-block">kubectl get service user-service
kubectl get endpoints user-service
kubectl get endpointslice \
  -l kubernetes.io/service-name=user-service

# 로컬 PC에서 임시 확인
kubectl port-forward service/user-service 18080:8080</pre><p>다른 터미널에서 호출합니다.</p><pre class="code-block">curl -i http://127.0.0.1:18080/healthcheck</pre><p class="tip">Service는 있는데 Endpoint가 비어 있으면 Service selector와 Pod label 불일치 또는 readinessProbe 실패입니다. Endpoint에 Pod IP 두 개가 나타나야 두 Replica로 분산할 수 있습니다.</p></section>
<section class="panel"><h2>8. Probe 역할 비교</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>Probe</th><th>실패 시 동작</th><th>사용 목적</th><th>주의사항</th></tr></thead><tbody>
<tr><td>startupProbe</td><td>성공 전 다른 Probe 유예, 계속 실패하면 재시작</td><td>느린 초기화 보호</td><td>최대 시작 시간을 넉넉히 계산</td></tr>
<tr><td>readinessProbe</td><td>Pod를 Service Endpoint에서 제외</td><td>요청을 받을 준비 판단</td><td>실패해도 Container를 재시작하지 않음</td></tr>
<tr><td>livenessProbe</td><td>Container 재시작</td><td>교착·복구 불가능 상태 탐지</td><td>외부 DB의 순간 장애에 과민하게 설정 금지</td></tr>
</tbody></table></div><pre class="code-block">kubectl describe pod -l app=user
kubectl get pod -l app=user \
  -o custom-columns='NAME:.metadata.name,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount'</pre></section>
<section class="panel"><h2>9. Pod 자동복구 실험</h2><pre class="code-block">kubectl get pod -l app=user -o wide
OLD_POD=$(kubectl get pod -l app=user \
  -o jsonpath='{.items[0].metadata.name}')
kubectl delete pod "$OLD_POD"

kubectl get pod -l app=user -w</pre><p>새 Pod가 자동 생성되어 <code>Running</code>과 <code>Ready</code>가 되면 <kbd>Ctrl+C</kbd>로 감시를 종료합니다.</p><pre class="code-block">kubectl get deployment user-deployment
kubectl get endpoints user-service</pre><p class="tip">Pod를 삭제해도 Deployment의 desired replicas가 2이므로 ReplicaSet이 새 Pod를 만듭니다. 같은 Pod 이름이 되살아나는 것이 아니라 새 이름과 새 IP를 가진 Pod가 생성됩니다.</p></section>
<section class="panel"><h2>10. Rolling Update와 Rollback</h2><pre class="code-block"># 새 이미지 digest로 교체
kubectl set image deployment/user-deployment \
  user=&lt;ACCOUNT_ID&gt;.dkr.ecr.ap-northeast-2.amazonaws.com/user@sha256:&lt;NEW_DIGEST&gt;

kubectl rollout status deployment/user-deployment \
  --timeout=5m
kubectl rollout history deployment/user-deployment
kubectl get pod -l app=user -o wide

# 새 버전에 문제가 있으면 즉시 이전 revision으로 복구
kubectl rollout undo deployment/user-deployment
kubectl rollout status deployment/user-deployment \
  --timeout=5m</pre><p class="tip"><code>maxUnavailable: 0</code>, <code>maxSurge: 1</code>이므로 업데이트 중 준비된 기존 Pod를 먼저 유지하고 새 Pod를 추가합니다. Node의 CPU·메모리 여유가 있어야 Surge Pod가 Scheduling됩니다.</p></section>
<section class="panel"><h2>11. 장애 분석 명령 순서</h2><pre class="code-block">kubectl get pod -l app=user -o wide
kubectl describe pod -l app=user
kubectl logs -l app=user --all-containers \
  --tail=100 --prefix
kubectl logs &lt;POD_NAME&gt; --previous
kubectl get events --sort-by='.lastTimestamp' | tail -30
kubectl get endpoints user-service
kubectl top pod -l app=user
kubectl top node</pre><ol><li>Pod 상태와 <code>READY</code>를 봅니다.</li><li><code>describe</code>의 Events에서 Scheduling, Pull, Probe 실패를 찾습니다.</li><li>현재 로그와 <code>--previous</code> 로그로 재시작 직전 원인을 확인합니다.</li><li>Endpoint와 자원 사용량을 확인합니다.</li></ol></section>

</tbody></table></div></section>

<tr><td>USER</td><td><code>user-deployment</code></td><td><code>user-service:8080</code></td><td>2</td><td>RDS MySQL</td></tr>
<tr><td>PRODUCT</td><td><code>product-deployment</code></td><td><code>product-service:8080</code></td><td>2</td><td>RDS MySQL, S3</td></tr>
<tr><td>STRESS</td><td><code>stress-deployment</code></td><td><code>stress-service:8080</code></td><td>1</td><td>CPU 부하 기능</td></tr>

<section class="panel"><h2>1. 사전 점검과 이미지 Digest 기록</h2><pre class="code-block">export AWS_REGION=ap-northeast-2
export NAMESPACE=apdev
export AWS_ACCOUNT_ID=$(aws sts get-caller-identity \
  --query Account --output text)
export ECR_PREFIX=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

kubectl config set-context --current --namespace="$NAMESPACE"
kubectl get nodes
kubectl get deployment user-deployment

for APP in user product stress; do
  aws ecr describe-images \
    --region "$AWS_REGION" \
    --repository-name "$APP" \
    --query 'sort_by(imageDetails,&amp; imagePushedAt)[-1].{digest:imageDigest,tags:imageTags,pushed:imagePushedAt}' \
    --output table
done</pre><p class="tip">세 이미지의 <code>sha256</code> digest를 각각 기록합니다. 최신 이미지라는 이유만으로 태그를 추측하지 말고 6차시에서 검증한 digest와 일치하는지 확인합니다.</p></section>
<section class="panel"><h2>2. 공통 ConfigMap·Secret 확인</h2><pre class="code-block">kubectl get configmap user-config
kubectl get secret user-db-secret

# 이름을 세 앱에서 공유하도록 명확하게 변경
kubectl create configmap app-config \
  --from-literal=MYSQL_HOST=&lt;RDS_ENDPOINT&gt; \
  --from-literal=MYSQL_PORT=3306 \
  --from-literal=MYSQL_DBNAME=dev \
  --from-literal=AWS_REGION=ap-northeast-2 \
  --from-literal=S3_BUCKET=&lt;PRODUCT_IMAGE_BUCKET&gt; \
  --dry-run=client -o yaml | kubectl apply -f -

read -rsp 'DB password: ' DB_PASSWORD; echo
umask 077
printf '%s' "$DB_PASSWORD" &gt; /tmp/mysql-password
kubectl create secret generic app-db-secret \
  --from-literal=MYSQL_USER=appuser \
  --from-file=MYSQL_PASSWORD=/tmp/mysql-password \
  --dry-run=client -o yaml | kubectl apply -f -
rm -f /tmp/mysql-password
unset DB_PASSWORD

kubectl get configmap app-config
kubectl get secret app-db-secret</pre><p class="tip">권한 600인 임시 파일을 사용하고 Secret 생성 직후 삭제합니다. 비밀번호를 명령줄, YAML, Git 기록에 직접 넣지 않습니다.</p></section>
<section class="panel"><h2>3. PRODUCT Deployment·Service</h2><pre class="code-block">cat &gt; 30-product.yaml &lt;&lt;'EOF'

kind: Deployment
metadata:
  name: product-deployment

spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels: {app: product}

    metadata:
      labels: {app: product}

      containers:
        - name: product
          image: &lt;ACCOUNT_ID&gt;.dkr.ecr.ap-northeast-2.amazonaws.com/product@sha256:&lt;PRODUCT_DIGEST&gt;
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-db-secret}

            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /healthcheck, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthcheck, port: http}
            periodSeconds: 10
            failureThreshold: 3
---

kind: Service
metadata:
  name: product-service
  namespace: apdev

  type: ClusterIP

EOF</pre><p class="tip">11차시의 S3 접근은 Access Key 환경변수 대신 Pod용 IAM 권한을 연결합니다. 이 단계에서는 버킷 이름과 리전만 ConfigMap으로 전달합니다.</p></section>
<section class="panel"><h2>4. STRESS Deployment·Service</h2><pre class="code-block">cat &gt; 40-stress.yaml &lt;&lt;'EOF'

<section class="panel"><h2>5. USER 설정을 공통 이름으로 갱신</h2><pre class="code-block"># 8차시 USER Deployment의 envFrom 참조를 공통 객체로 변경
kubectl set env deployment/user-deployment \
  --from=configmap/app-config
kubectl set env deployment/user-deployment \
  --from=secret/app-db-secret

# USER 이미지도 검증한 digest인지 확인
kubectl get deployment user-deployment \
  -o jsonpath='{.spec.template.spec.containers[0].image}'; echo

# 필요하면 명시적으로 digest 고정
kubectl set image deployment/user-deployment \
  user=&lt;ACCOUNT_ID&gt;.dkr.ecr.ap-northeast-2.amazonaws.com/user@sha256:&lt;USER_DIGEST&gt;</pre><p class="tip"><code>kubectl set env --from</code>은 기존 환경변수에 값을 추가합니다. 이전 <code>user-config</code>, <code>user-db-secret</code> 참조를 완전히 제거하려면 8차시 USER YAML의 <code>envFrom</code>을 <code>app-config</code>, <code>app-db-secret</code>로 바꾸어 다시 적용하는 편이 가장 명확합니다.</p></section>
<section class="panel"><h2>6. 세 애플리케이션 적용</h2><pre class="code-block">kubectl apply -f 10-user-deployment.yaml
kubectl apply -f 20-user-service.yaml
kubectl apply -f 30-product.yaml
kubectl apply -f 40-stress.yaml

for DEPLOY in user-deployment product-deployment stress-deployment; do
  kubectl rollout status deployment/$DEPLOY --timeout=5m || exit 1
done

kubectl get deployment,replicaset,pod,service -o wide</pre><p class="tip">USER YAML의 ConfigMap·Secret 이름을 공통 객체로 수정한 다음 적용합니다. 하나라도 Rollout이 실패하면 다음 단계로 넘어가지 말고 해당 Deployment의 Pod Event와 로그를 확인합니다.</p></section>
<section class="panel"><h2>7. 배포 상태 표로 확인</h2><pre class="code-block">kubectl get deployment \
  -o custom-columns='NAME:.metadata.name,DESIRED:.spec.replicas,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas'

kubectl get pod \
  -o custom-columns='NAME:.metadata.name,APP:.metadata.labels.app,NODE:.spec.nodeName,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount'

kubectl get service \
  -o custom-columns='NAME:.metadata.name,TYPE:.spec.type,CLUSTER-IP:.spec.clusterIP,PORT:.spec.ports[0].port'</pre><div class="check-grid"><div class="check-item"><b>USER</b>Ready 2/2</div><div class="check-item"><b>PRODUCT</b>Ready 2/2</div><div class="check-item"><b>STRESS</b>Ready 1/1</div><div class="check-item"><b>Service</b>모두 ClusterIP :8080</div></div></section>
<section class="panel"><h2>8. Label·Selector·Endpoint 검증</h2><pre class="code-block">for APP in user product stress; do
  echo "===== $APP ====="
  kubectl get deployment "$APP-deployment" \
    -o jsonpath='deploy-selector={.spec.selector.matchLabels.app},pod-label={.spec.template.metadata.labels.app}'; echo
  kubectl get service "$APP-service" \
    -o jsonpath='service-selector={.spec.selector.app}'; echo
  kubectl get endpoints "$APP-service"
done</pre><p class="tip">세 출력의 앱 이름이 각각 일치해야 합니다. Endpoint가 <code>&lt;none&gt;</code>이면 label/selector 또는 readinessProbe를 확인합니다. USER·PRODUCT는 Ready Endpoint 2개, STRESS는 1개가 정상입니다.</p></section>
<section class="panel"><h2>9. Cluster 내부 DNS·Healthcheck</h2><pre class="code-block">kubectl run api-check \
  --image=curlimages/curl:8.10.1 \
  --restart=Never --command -- sleep 3600
kubectl wait --for=condition=Ready pod/api-check --timeout=2m

for APP in user product stress; do
  kubectl exec api-check -- \
    curl -fsS -o /dev/null -w "$APP=%{http_code}\n" \
    "http://$APP-service:8080/healthcheck"
done</pre><p>기대 결과는 세 앱 모두 <code>200</code>입니다. 같은 Namespace에서는 <code>user-service</code>처럼 짧은 DNS 이름을 사용하고, 다른 Namespace에서는 <code>user-service.apdev.svc.cluster.local</code>을 사용합니다.</p></section>
<section class="panel"><h2>10. 핵심 API Smoke Test</h2><pre class="code-block">export REQUEST_ID=999999999999
export UUID=7c5a3c6a-758f-4bc5-9bdf-3e573a0ad729
export EMAIL=dbdump500001@example.org

kubectl exec api-check -- curl -fsS -G \
  http://user-service:8080/v1/user \
  --data-urlencode "email=$EMAIL" \
  --data-urlencode "requestid=$REQUEST_ID" \
  --data-urlencode "uuid=$UUID"

kubectl exec api-check -- curl -fsS -G \
  http://product-service:8080/v1/product \
  --data-urlencode 'id=dbdump500001' \
  --data-urlencode "requestid=$REQUEST_ID" \
  --data-urlencode "uuid=$UUID"

kubectl exec api-check -- curl -fsS -X POST \
  http://stress-service:8080/v1/stress \
  -H 'Content-Type: application/json' \
  -d "{\"requestid\":\"$REQUEST_ID\",\"uuid\":\"$UUID\",\"length\":256}"</pre><p class="tip">STRESS는 1회만 실행합니다. USER·PRODUCT 조회가 실패하면 앱 로그와 RDS SG, dump 데이터 존재 여부를 순서대로 확인합니다.</p></section>
<section class="panel"><h2>11. 로그·재시작·리소스 확인</h2><pre class="code-block">for APP in user product stress; do
  echo "===== $APP logs ====="
  kubectl logs -l app=$APP \
    --all-containers --tail=30 --prefix
  kubectl get pod -l app=$APP \
    -o custom-columns='NAME:.metadata.name,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount'
done

kubectl top pod
kubectl top node
kubectl get events --sort-by='.lastTimestamp' | tail -30</pre><p>정상 요청 직후 로그에 치명적인 DB 오류, S3 권한 오류, Probe 실패 또는 반복 재시작이 없어야 합니다. CPU·메모리 측정값은 15차시 튜닝 기준값으로 기록합니다.</p></section>
<section class="panel"><h2>12. 앱별 Rollout 개별 제어</h2><pre class="code-block"># PRODUCT만 새 digest로 변경
kubectl set image deployment/product-deployment \
  product=&lt;ACCOUNT_ID&gt;.dkr.ecr.ap-northeast-2.amazonaws.com/product@sha256:&lt;NEW_PRODUCT_DIGEST&gt;
kubectl rollout status deployment/product-deployment --timeout=5m

# 다른 두 Deployment가 변경되지 않았는지 확인
kubectl rollout history deployment/user-deployment
kubectl rollout history deployment/product-deployment
kubectl rollout history deployment/stress-deployment

# 문제 발생 시 PRODUCT만 복구
kubectl rollout undo deployment/product-deployment</pre><p class="tip">앱별 Deployment를 분리했기 때문에 PRODUCT 배포 실패가 USER·STRESS의 revision을 변경하지 않습니다.</p></section>
<section class="panel"><h2>13. 오류별 해결표</h2><div class="table-wrap"><table class="network-table"><thead><tr><th>증상</th><th>범위</th><th>확인·조치</th></tr></thead><tbody>
<tr><td>세 앱 모두 <code>ImagePullBackOff</code></td><td>공통 Node Role·ECR 경로</td><td>Node IAM Policy, NAT/VPC Endpoint 확인</td></tr>
<tr><td>한 앱만 <code>ImagePullBackOff</code></td><td>해당 ECR URI·digest</td><td>Deployment image와 ECR digest 비교</td></tr>

<tr><td>PRODUCT만 S3 AccessDenied</td><td>Pod IAM·Bucket Policy</td><td>11차시 IAM 권한과 버킷 이름 확인</td></tr>

<section class="panel"><h2>14. 임시 리소스 정리와 최종 검증</h2><pre class="code-block">kubectl delete pod api-check

for APP in user product stress; do
  kubectl rollout status deployment/$APP-deployment --timeout=2m
  kubectl get endpoints $APP-service
  kubectl get deployment $APP-deployment \
    -o jsonpath='{.metadata.name}: ready={.status.readyReplicas}/{.spec.replicas}, image={.spec.template.spec.containers[0].image}'; echo
done
