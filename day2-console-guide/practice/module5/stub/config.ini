; stub — configuration
; Fill in the values for your environment before starting the service.

[server]
; TCP port the service listens on.
port = 8081

[aws]
; Region used for AWS API calls made by this service.
region = eu-central-1

[database]
; Writer or reader endpoint of the relational store.
host   = <aurora-cluster-endpoint>
port   = 3306
dbname = shgold
user   = 
password    =

; Name of the AWS Secrets Manager secret holding {"username","password"}.
; When set, it takes precedence over the plaintext password below.
; secret_name = shgold/aurora/credentials


[log]
; info | debug
level = info
; Write one access log line per request. on | off
access = on
; Also log health-check requests. The load balancer calls them every few
; seconds, so this is off by default.
access_health = off
